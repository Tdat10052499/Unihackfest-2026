<x-dc>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#080812}
@keyframes nedIconIn{0%{opacity:0;transform:scale(.55)}60%{opacity:1;transform:scale(1.07)}100%{opacity:1;transform:scale(1)}}
@keyframes nedRing{0%{opacity:.55;transform:scale(.7)}100%{opacity:0;transform:scale(2.3)}}
@keyframes nedRise{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
@keyframes nedPeek{0%{opacity:0;transform:translateY(120px)}65%{opacity:1;transform:translateY(-10px)}100%{opacity:1;transform:translateY(0)}}
@keyframes nedGlow{0%,100%{opacity:.55}50%{opacity:.9}}
.ned-icon{animation:nedIconIn .7s cubic-bezier(.2,.9,.3,1.2) both}
.ned-ring{animation:nedRing 1.1s ease-out .25s both}
.ned-word{animation:nedRise .45s ease-out .45s both}
.ned-peek{animation:nedPeek .8s cubic-bezier(.2,.9,.3,1.1) .15s both}
.ned-glow{animation:nedGlow 2.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.ned-icon,.ned-ring,.ned-word,.ned-peek,.ned-glow{animation:none}.ned-ring{opacity:0}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; color: #FFFFFF; overflow: hidden; position: relative">

  <!-- A. Brand mark: solid NED purple, one centred icon, no spinner -->

      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="4" width="3" height="8" rx="1" fill="#FFFFFF"></rect><rect x="4" y="2" width="3" height="10" rx="1" fill="#FFFFFF"></rect><rect x="8" y="0" width="3" height="12" rx="1" fill="#FFFFFF"></rect><rect x="12" y="2" width="3" height="10" rx="1" fill="rgba(255,255,255,0.25)"></rect></svg>

    </div>
  </div>

      <div style="position: absolute; top: 50%; left: 50%; width: 520px; height: 520px; margin: -300px 0 0 -260px; background: radial-gradient(circle, rgba(255,255,255,0.16) 0%, transparent 60%); pointer-events: none" class="ned-glow"></div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; margin-top: -40px">
        <div style="position: relative; width: 128px; height: 128px">
          <div class="ned-ring" style="position: absolute; inset: 0; border-radius: 36px; border: 2px solid rgba(255,255,255,0.6)"></div>

            <img src="/_blob/3606719d081640f73145640e612b071e" alt="" style="width: 98px; height: 100px">
          </div>
        </div>
        <div class="ned-word" style="margin-top: 28px; font-family: 'Space Grotesk', sans-serif; font-size: 34px; font-weight: 700; letter-spacing: 8px; padding-left: 8px">N.E.D</div>
      </div>
    </a>
  </sc-if>

  <!-- B. Mascot peek: Teddy rises from the bottom edge -->
  <sc-if value="{{isMascot}}" hint-placeholder-val="{{ false }}">
    <a href="OnbWelcome.dc.html" aria-label="N.E.D. Tap to continue" style="position: absolute; inset: 0; display: flex; flex-direction: column; text-decoration: none; color: #FFFFFF; background: linear-gradient(170deg, #1A0B33 0%, #110822 40%, #080812 100%)">

      </div>
      <div class="ned-peek" style="position: absolute; left: 50%; bottom: -40px; margin-left: -150px; width: 300px; height: 234px">
        <img src="/_blob/5bb51609a7ff36b0643dc0cc23146ac6" alt="" style="width: 300px; height: 234px; object-fit: contain">
      </div>
    </a>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["mark","mascot"],"default":"mark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var v = this.props.variant ?? 'mark';
    return { isMark: v === 'mark', isMascot: v === 'mascot' };
  }
}
</script>
