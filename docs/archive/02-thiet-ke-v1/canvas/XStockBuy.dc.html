<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NED xStocks — Buy Apple</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#080812}
a{color:#9B4FDE}a:hover{color:#B87AED}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(170deg, #110822 0%, #0D0618 30%, #080812 60%, #06060E 100%); color: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <div style="position: absolute; top: 60px; left: 50%; margin-left: -150px; width: 300px; height: 240px; background: radial-gradient(ellipse, rgba(123,47,190,0.22) 0%, transparent 65%); pointer-events: none"></div>

  <!-- Status Bar -->
  <div style="padding: 12px 24px 8px; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2">
    <div style="font-size: 14px; font-weight: 600; color: #FFFFFF">9:41</div>
    <div style="display: flex; gap: 6px; align-items: center">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="4" width="3" height="8" rx="1" fill="#FFFFFF"></rect><rect x="4" y="2" width="3" height="10" rx="1" fill="#FFFFFF"></rect><rect x="8" y="0" width="3" height="12" rx="1" fill="#FFFFFF"></rect><rect x="12" y="2" width="3" height="10" rx="1" fill="rgba(255,255,255,0.25)"></rect></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2" stroke="rgba(255,255,255,0.3)"></rect><rect x="2" y="2" width="15" height="8" rx="1" fill="#22C55E"></rect><rect x="22.5" y="3.5" width="2" height="5" rx="1" fill="rgba(255,255,255,0.3)"></rect></svg>
    </div>
  </div>

  <!-- Header -->
  <div style="padding: 4px 20px 0; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 2">
    <a href="XStockDetail.dc.html" aria-label="Back to Apple" style="width: 44px; height: 44px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700">Buy Apple</h1>
    <div style="width: 44px; height: 44px"></div>
  </div>

  <!-- Amount -->
  <div style="padding: 22px 20px 0; text-align: center; position: relative; z-index: 1">
    <div style="font-size: 12px; color: rgba(255,255,255,0.55)">Amount to invest</div>
    <div style="margin-top: 6px; font-family: 'Space Grotesk', sans-serif; font-size: 52px; font-weight: 700; letter-spacing: -2px; line-height: 1.05; color: #FFFFFF">${{amount}}</div>
    <div style="margin-top: 8px; font-family: 'Space Mono', monospace; font-size: 13px; color: rgba(255,255,255,0.65)">≈ {{shares}} AAPLx</div>
    <sc-if value="{{tooMuch}}" hint-placeholder-val="{{ false }}">
      <div style="margin-top: 6px; font-size: 12px; font-weight: 600; color: #F87171">Not enough USDC. Available: $750.00</div>
    </sc-if>
  </div>

  <!-- Quick amounts -->
  <div style="margin: 16px 20px 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; position: relative; z-index: 1">
    <sc-for list="{{quick}}" as="c" hint-placeholder-count="4">
      <button onClick="{{c.pick}}" style="height: 38px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); color: #FFFFFF; font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer">{{c.label}}</button>
    </sc-for>
  </div>

  <!-- Pay with -->
  <div style="margin: 12px 20px 0; padding: 10px 12px; display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09); border-radius: 14px; position: relative; z-index: 1">
    <div style="width: 34px; height: 34px; background: #2775CA; border-radius: 9999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <span style="font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 700; color: #FFFFFF">$</span>
    </div>
    <div style="flex: 1; min-width: 0">
      <div style="font-size: 11px; color: rgba(255,255,255,0.55)">Pay with</div>
      <div style="font-size: 14px; font-weight: 600; margin-top: 1px">{{payLabel}}</div>
    </div>
    <div style="text-align: right">
      <div style="font-family: 'Space Mono', monospace; font-size: 12px; color: rgba(255,255,255,0.75)">$750.00</div>
      <div style="font-size: 11px; color: rgba(255,255,255,0.5)">available</div>
    </div>
    <sc-if value="{{canChange}}" hint-placeholder-val="{{ true }}">
      <button aria-label="Change payment token" style="min-width: 44px; height: 44px; margin-right: -6px; background: transparent; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2.5" stroke-linecap="round"><path d="m6 9 6 6 6-6"></path></svg>
      </button>
    </sc-if>
  </div>

  <!-- Summary -->
  <div style="margin: 10px 24px 0; display: flex; flex-direction: column; gap: 6px; font-size: 12px; position: relative; z-index: 1">
    <div style="display: flex; justify-content: space-between"><span style="color: rgba(255,255,255,0.55)">Price per share</span><span style="font-family: 'Space Mono', monospace; color: rgba(255,255,255,0.85)">$243.42</span></div>
    <div style="display: flex; justify-content: space-between"><span style="color: rgba(255,255,255,0.55)">N.E.D fee (0.25%)</span><span style="font-family: 'Space Mono', monospace; color: rgba(255,255,255,0.85)">${{fee}}</span></div>
  </div>

  <div style="flex: 1"></div>

  <!-- Keypad -->
  <div style="padding: 0 20px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; position: relative; z-index: 1">
    <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
      <button onClick="{{k.press}}" aria-label="{{k.aria}}" style="height: 52px; background: transparent; border: none; border-radius: 12px; cursor: pointer; color: #FFFFFF; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 500">{{k.label}}</button>
    </sc-for>
  </div>

  <!-- CTA -->
  <div style="padding: 10px 20px 28px; position: relative; z-index: 1">
    <sc-if value="{{ready}}" hint-placeholder-val="{{ true }}">
      <a href="XStockReview.dc.html" style="height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 16px; background: linear-gradient(135deg, #7B2FBE 0%, #9B4FDE 50%, #6366F1 100%); font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700; color: #FFFFFF; text-decoration: none">Review order</a>
    </sc-if>
    <sc-if value="{{notReady}}" hint-placeholder-val="{{ false }}">
      <div aria-disabled="true" style="height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 16px; background: rgba(255,255,255,0.08); font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700; color: rgba(255,255,255,0.4)">Review order</div>
    </sc-if>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"walletMode":{"editor":"enum","options":["cash","crypto"],"default":"cash"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { amt: '50' };
  }
  renderVals() {
    var self = this;
    var mode = this.props.walletMode ?? 'cash';
    var price = 243.42, bal = 750, feeRate = 0.0025;
    var amt = this.state.amt;
    var v = parseFloat(amt) || 0;
    function press(k) {
      var a = self.state.amt;
      if (k === 'del') a = a.length > 1 ? a.slice(0, -1) : '0';
      else if (k === '.') { if (a.indexOf('.') < 0) a = a + '.'; }
      else {
        if (a === '0') a = k;
        else if (a.indexOf('.') >= 0 && a.split('.')[1].length >= 2) return;
        else if (a.replace('.', '').length >= 7) return;
        else a = a + k;
      }
      self.setState({ amt: a });
    }
    var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '.', '0', 'del'].map(function (k) {
      return { label: k === 'del' ? '⌫' : k, aria: k === 'del' ? 'Delete' : (k === '.' ? 'Decimal point' : k), press: function () { press(k); } };
    });
    var quick = [['$10', '10'], ['$50', '50'], ['$100', '100'], ['Max', '750']].map(function (q) {
      return { label: q[0], pick: function () { self.setState({ amt: q[1] }); } };
    });
    var tooMuch = v > bal;
    var ready = v > 0 && !tooMuch;
    return {
      amount: amt,
      shares: (v * (1 - feeRate) / price).toFixed(4),
      fee: (v * feeRate).toFixed(2),
      tooMuch: tooMuch, ready: ready, notReady: !ready,
      keys: keys, quick: quick,
      payLabel: mode === 'cash' ? 'Cash balance (USDC)' : 'USDC',
      canChange: mode === 'crypto'
    };
  }
}
</script>
</body>
</html>
