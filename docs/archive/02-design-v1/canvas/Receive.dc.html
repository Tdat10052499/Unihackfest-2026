<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NED — Receive</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#080812}
a{color:#B87AED}a:hover{color:#D4AEF6}
.ned-scroll::-webkit-scrollbar{display:none}
.ned-scroll{scrollbar-width:none;-ms-overflow-style:none}
input::placeholder{color:rgba(255,255,255,0.35)}
@keyframes nedspin{to{transform:rotate(360deg)}}
@keyframes nedbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(170deg, #110822 0%, #0D0618 30%, #080812 60%, #06060E 100%); color: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <div style="position: absolute; top: 90px; left: 50%; margin-left: -200px; width: 400px; height: 360px; background: radial-gradient(circle, rgba(123,47,190,0.3) 0%, transparent 65%); pointer-events: none"></div>
  <div style="padding: 12px 24px 8px; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2">
    <div style="font-size: 14px; font-weight: 600; color: #FFFFFF">9:41</div>
    <div style="display: flex; gap: 6px; align-items: center">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="4" width="3" height="8" rx="1" fill="#FFFFFF"></rect><rect x="4" y="2" width="3" height="10" rx="1" fill="#FFFFFF"></rect><rect x="8" y="0" width="3" height="12" rx="1" fill="#FFFFFF"></rect><rect x="12" y="2" width="3" height="10" rx="1" fill="rgba(255,255,255,0.25)"></rect></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2" stroke="rgba(255,255,255,0.3)"></rect><rect x="2" y="2" width="15" height="8" rx="1" fill="#22C55E"></rect><rect x="22.5" y="3.5" width="2" height="5" rx="1" fill="rgba(255,255,255,0.3)"></rect></svg>
    </div>
  </div>

  <div style="padding: 4px 20px 0; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 2">
    <a href="HomeV4.dc.html" aria-label="Back to Home" style="width: 44px; height: 44px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700">Receive</h1>
    <div style="width: 44px; height: 44px"></div>
  </div>
  <div class="ned-scroll" style="flex: 1; overflow-y: auto; padding: 16px 24px 0; position: relative; z-index: 1">
    <p style="margin: 0; font-size: 14px; line-height: 1.5; text-align: center; color: rgba(255,255,255,0.7)">Friends on N.E.D can pay you with your username or phone number. Anyone else can scan this code.</p>

    <!-- QR card -->
    <div style="margin: 18px auto 0; width: 244px; padding: 18px; box-sizing: border-box; border-radius: 26px; background: #FFFFFF; box-shadow: 0 18px 48px rgba(20,6,50,0.45); position: relative">
      <svg width="208" height="208" viewBox="0 0 29 29" role="img" aria-label="QR code for your N.E.D wallet" shape-rendering="crispEdges">
        <path d="{{qr}}" fill="#16101F"></path>
      </svg>
      <div style="position: absolute; top: 50%; left: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 14px; background: linear-gradient(135deg, #9B4FDE, #6366F1); border: 4px solid #FFFFFF; box-sizing: border-box; display: flex; align-items: flex-end; justify-content: center; overflow: hidden">
        <img src="/_blob/3606719d081640f73145640e612b071e" alt="" style="width: 44px; height: 45px; margin-bottom: -5px">
      </div>
    </div>
    <div style="margin-top: 16px; text-align: center">
      <div style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700">@tdat</div>
      <div style="margin-top: 4px; font-size: 13px; color: rgba(255,255,255,0.6)">N.E.D wallet · Solana</div>
    </div>

    <!-- Details -->
    <div style="margin-top: 18px; padding: 2px 16px; border-radius: 18px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1)">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
        <div style="{{r.rowStyle}}">
          <div style="min-width: 0">
            <div style="font-size: 12px; color: rgba(255,255,255,0.55)">{{r.label}}</div>
            <div style="margin-top: 2px; font-family: 'Space Mono', monospace; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.value}}</div>
          </div>
          <button onClick="{{r.copy}}" aria-label="{{r.copyLabel}}" style="width: 44px; height: 44px; margin-right: -10px; flex-shrink: 0; background: transparent; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center">
            <sc-if value="{{r.copied}}" hint-placeholder-val="{{ false }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#4ADE80" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
            <sc-if value="{{r.notCopied}}" hint-placeholder-val="{{ true }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg></sc-if>
          </button>
        </div>
      </sc-for>
    </div>

    <div style="margin-top: 12px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; background: rgba(245,158,11,0.1); border: 1px solid rgba(251,191,36,0.3); border-radius: 14px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" style="flex-shrink: 0; margin-top: 1px" aria-hidden="true"><path d="M12 3 2 20h20L12 3z"></path><path d="M12 10v4M12 17v.5"></path></svg>
      <div style="font-size: 12px; line-height: 1.5; color: rgba(255,255,255,0.82)">Only receive <strong>USDC, SOL or Solana tokens</strong>. Funds sent from another network can't be recovered.</div>
    </div>
    <div style="height: 16px"></div>
  </div>
  <div style="padding: 12px 24px 28px; position: relative; z-index: 1">
    <button onClick="{{share}}" style="width: 100%; border: none; cursor: pointer; height: 56px; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 16px; background: linear-gradient(135deg, #7B2FBE 0%, #9B4FDE 50%, #6366F1 100%); font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700; color: #FFFFFF; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"></path><path d="M16 6l-4-4-4 4M12 2v13"></path></svg>
      {{shareLabel}}
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { copied: '', shared: false }; }
  renderVals() {
    var self = this;
    // Decorative QR-style pattern (fixed seed); the real app renders the wallet address as a QR
    var N = 29, d = '', seed = 7;
    function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    function finder(x, y) { return x < 7 && y < 7 || x >= N - 7 && y < 7 || x < 7 && y >= N - 7; }
    function finderOn(x, y) {
      var fx = x >= N - 7 ? x - (N - 7) : x, fy = y >= N - 7 ? y - (N - 7) : y;
      return fx === 0 || fx === 6 || fy === 0 || fy === 6 || (fx >= 2 && fx <= 4 && fy >= 2 && fy <= 4);
    }
    for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) {
      var on = finder(x, y) ? finderOn(x, y) : (x > 10 && x < 18 && y > 10 && y < 18 ? false : rnd() > 0.52);
      if (on) d += 'M' + x + ' ' + y + 'h1v1h-1z';
    }
    var data = [
      { key: 'user', label: 'Username', value: '@tdat' },
      { key: 'phone', label: 'Phone number', value: '+84 90 •••• 4567' },
      { key: 'addr', label: 'Wallet address', value: '7xK9mQ…Vr3fQa', full: '7xK9mQ2vR8LpT4wZ1nC6yH3bJ5dFsEaGu9kVr3fQa' }
    ];
    var rows = data.map(function (r, i) {
      var c = self.state.copied === r.key;
      return {
        label: r.label, value: r.value, copied: c, notCopied: !c,
        copyLabel: c ? r.label + ' copied' : 'Copy ' + r.label.toLowerCase(),
        copy: function () { try { if (navigator.clipboard) navigator.clipboard.writeText(r.full || r.value); } catch (e) {} self.setState({ copied: r.key }); },
        rowStyle: 'display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0;' + (i < data.length - 1 ? ' border-bottom: 1px solid rgba(255,255,255,0.08)' : '')
      };
    });
    return {
      qr: d, rows: rows,
      share: function () { self.setState({ shared: true }); },
      shareLabel: this.state.shared ? 'Link copied' : 'Share my details'
    };
  }
}
</script>
</body>
</html>
