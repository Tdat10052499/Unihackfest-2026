<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NED Wallet cards</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#080812}
a{color:#7B2FBE}
.ned-scroll::-webkit-scrollbar{display:none}
.ned-scroll{scrollbar-width:none;-ms-overflow-style:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #16101F; overflow: hidden; position: relative">
<div class="ned-scroll" style="position: absolute; inset: 0; overflow-y: auto">

  <!-- Dark top -->
  <div style="position: relative; height: 440px; background: linear-gradient(180deg, #0A0614 0%, #1B0C3A 45%, #3A1A78 100%); color: #FFFFFF">
    <div style="position: absolute; top: 120px; left: 50%; width: 460px; height: 380px; margin-left: -230px; background: radial-gradient(ellipse, rgba(99,102,241,0.45) 0%, transparent 62%); pointer-events: none"></div>
  <div style="padding: 12px 24px 8px; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2">
    <div style="font-size: 14px; font-weight: 600; color: #FFFFFF">9:41</div>
    <div style="display: flex; gap: 6px; align-items: center">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="4" width="3" height="8" rx="1" fill="#FFFFFF"></rect><rect x="4" y="2" width="3" height="10" rx="1" fill="#FFFFFF"></rect><rect x="8" y="0" width="3" height="12" rx="1" fill="#FFFFFF"></rect><rect x="12" y="2" width="3" height="10" rx="1" fill="rgba(255,255,255,0.25)"></rect></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2" stroke="rgba(255,255,255,0.3)"></rect><rect x="2" y="2" width="15" height="8" rx="1" fill="#22C55E"></rect><rect x="22.5" y="3.5" width="2" height="5" rx="1" fill="rgba(255,255,255,0.3)"></rect></svg>
    </div>
  </div>

    <div style="padding: 4px 16px 0; display: flex; justify-content: space-between; align-items: center; position: relative">
      <a href="HomeV4.dc.html" aria-label="Back to Home" style="width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; text-decoration: none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"></path></svg>
      </a>
      <div style="font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 600">My wallets</div>
      <button aria-label="Wallet options" style="width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.08); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#FFFFFF"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg>
      </button>
    </div>
  </div>

  <!-- Card carousel (overlaps dark/white boundary) -->
  <div style="position: relative; margin-top: -330px; height: 380px; overflow: hidden">
    <div style="{{trackStyle}}">
      <sc-for list="{{cards}}" as="c" hint-placeholder-count="3">
        <button onClick="{{c.pick}}" aria-label="{{c.aria}}" aria-current="{{c.current}}" style="{{c.style}}">
          <div style="position: absolute; top: 18px; left: 20px; font-family: 'Space Mono', monospace; font-size: 14px; letter-spacing: 1px; color: rgba(255,255,255,0.9)">•••• {{c.tail}}</div>
          <img src="/_blob/3606719d081640f73145640e612b071e" alt="" style="position: absolute; top: 50%; left: 50%; width: 132px; height: 135px; margin: -80px 0 0 -66px; opacity: 0.95; filter: drop-shadow(0 0 16px rgba(255,255,255,0.25))">
          <div style="position: absolute; left: 18px; bottom: 16px; display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 9999px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.18)">
            <div style="width: 12px; height: 12px; border-radius: 9999px; background: linear-gradient(135deg, #14F195, #9945FF)"></div>
            <span style="font-size: 11px; font-weight: 600; color: #FFFFFF">Solana</span>
          </div>
          <div style="position: absolute; right: 20px; bottom: 16px; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; color: #FFFFFF">{{c.name}}</div>
        </button>
      </sc-for>
    </div>
  </div>

  <!-- Pager -->
  <div role="tablist" aria-label="Choose wallet" style="margin-top: 12px; display: flex; justify-content: center; align-items: center; gap: 2px">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="3">
      <button role="tab" aria-selected="{{c.current}}" aria-label="{{c.name}} wallet" onClick="{{c.pick}}" style="width: 32px; height: 32px; background: transparent; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center">
        <div style="{{c.dot}}"></div>
      </button>
    </sc-for>
  </div>

  <!-- Balance -->
  <div style="margin-top: 10px; text-align: center">
    <div style="font-family: 'Space Grotesk', sans-serif; font-size: 44px; font-weight: 700; letter-spacing: -1.6px; line-height: 1">{{balance}}</div>
    <div style="margin-top: 8px; font-size: 13px; color: #6B6478">{{holds}}</div>
  </div>

  <!-- Actions -->
  <div style="margin: 20px 20px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{actions}}" as="a" hint-placeholder-count="3">
      <a href="{{a.href}}" style="height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 14px; background: #F3EFFA; font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 600; color: #16101F; text-decoration: none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16101F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{a.icon}}"></path></svg>{{a.label}}
      </a>
    </sc-for>
  </div>

  <!-- Wallet info -->
  <div style="padding: 26px 22px 32px">
    <h2 style="margin: 0 0 6px; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">Wallet info</h2>
    <sc-for list="{{info}}" as="i" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; border-bottom: 1px solid #EFEBF5">
        <div style="font-size: 15px; color: #6B6478">{{i.label}}</div>
        <div style="display: flex; align-items: center; gap: 4px">
          <div style="{{i.valueStyle}}">{{i.value}}</div>
          <sc-if value="{{i.copyable}}" hint-placeholder-val="{{ true }}">
            <button onClick="{{i.copy}}" aria-label="{{i.copyLabel}}" style="width: 40px; height: 40px; margin-right: -10px; background: transparent; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center">
              <sc-if value="{{i.copied}}" hint-placeholder-val="{{ false }}">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#15803D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
              </sc-if>
              <sc-if value="{{i.notCopied}}" hint-placeholder-val="{{ true }}">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#16101F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg>
              </sc-if>
            </button>
          </sc-if>
        </div>
      </div>
    </sc-for>
    <div style="margin-top: 14px; display: flex; gap: 8px; font-size: 12px; line-height: 1.5; color: #6B6478">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6B6478" stroke-width="2" stroke-linecap="round" style="flex-shrink: 0; margin-top: 2px"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
      All three wallets live at the same Solana address. N.E.D never shows or asks for your private key.
    </div>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"start":{"editor":"int","min":0,"max":2,"default":0},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { i: this.props.start ?? 0, copied: '' }; }
  renderVals() {
    var self = this;
    var addr = '7xK9mQ2vR8LpT4wZ1nC6yH3bJ5dFsEaGu9kVr3fQa';
    var W = [
      { name: 'Cash', bal: '$750.00', holds: '750.00 USDC · spend, send and invest', grad: 'linear-gradient(160deg, #B98AF0 0%, #7B2FBE 38%, #3A1A78 70%, #0E0620 100%)', token: 'USDC' },
      { name: 'Crypto', bal: '$362.85', holds: '2.45 SOL · 1 other token', grad: 'linear-gradient(160deg, #6EE7C8 0%, #1FB58F 26%, #5B3FD0 62%, #0E0620 100%)', token: 'SOL + 1 token' },
      { name: 'Stocks', bal: '$121.71', holds: '0.5 AAPLx · +$2.66 all-time', grad: 'linear-gradient(160deg, #F6C66E 0%, #D08A1E 26%, #7B2FBE 64%, #0E0620 100%)', token: 'AAPLx' }
    ];
    var i = this.state.i;
    var CW = 250, GAP = 16;
    var offset = (390 - CW) / 2 - i * (CW + GAP);
    var cards = W.map(function (w, k) {
      var on = k === i;
      return {
        name: w.name, tail: addr.slice(-4), current: on ? 'true' : 'false',
        aria: on ? w.name + ' wallet card' : 'Show ' + w.name + ' wallet',
        pick: function () { self.setState({ i: k, copied: '' }); },
        style: 'position: relative; flex-shrink: 0; width: ' + CW + 'px; height: 360px; padding: 0; border: none; cursor: pointer; border-radius: 24px; overflow: hidden; background: ' + w.grad + '; box-shadow: 0 24px 48px rgba(26,8,60,0.35), inset 0 1px 0 rgba(255,255,255,0.35); transition: transform .35s ease, opacity .35s ease; transform: scale(' + (on ? '1' : '0.92') + '); opacity: ' + (on ? '1' : '0.7'),
        dot: on ? 'width: 22px; height: 6px; border-radius: 9999px; background: #16101F' : 'width: 6px; height: 6px; border-radius: 9999px; background: #CFC7DC'
      };
    });
    var w = W[i];
    function short(a) { return a.slice(0, 4) + '…' + a.slice(-4); }
    function copyFn(key, text) {
      return function () {
        try { if (navigator.clipboard) navigator.clipboard.writeText(text); } catch (e) {}
        self.setState({ copied: key });
      };
    }
    var mono = "font-family: 'Space Mono', monospace; font-size: 15px; font-weight: 700; color: #16101F";
    var plain = 'font-size: 15px; font-weight: 600; color: #16101F';
    var rows = [
      { key: 'addr', label: 'Wallet address', value: short(addr), copy: addr, style: mono },
      { key: 'user', label: 'Username', value: '@tdat', copy: '@tdat', style: mono },
      { key: 'net', label: 'Network', value: 'Solana', style: plain },
      { key: 'holds', label: 'Holds', value: w.token, style: plain }
    ];
    var info = rows.map(function (r) {
      var c = self.state.copied === r.key;
      return {
        label: r.label, value: r.value, valueStyle: r.style,
        copyable: !!r.copy, copied: c, notCopied: !c,
        copyLabel: c ? r.label + ' copied' : 'Copy ' + r.label.toLowerCase(),
        copy: r.copy ? copyFn(r.key, r.copy) : null
      };
    });
    var P = { add: 'M12 5v14M5 12h14', send: 'M12 19V5M5 12l7-7 7 7', swap: 'M7 16V4m0 0L3 8m4-4 4 4M17 8v12m0 0 4-4m-4 4-4-4', buy: 'M3 3v18h18M7 15l4-6 4 3 5-7' };
    var actions = i === 2
      ? [{ label: 'Buy', icon: P.add, href: 'XStockBuy.dc.html' }, { label: 'Sell', icon: P.send, href: 'XStockSell.dc.html' }, { label: 'Market', icon: P.buy, href: 'XStocksList.dc.html' }]
      : [{ label: 'Add', icon: P.add, href: '#receive' }, { label: 'Send', icon: P.send, href: '#send' }, { label: 'Swap', icon: P.swap, href: 'SwapV1.dc.html' }];
    return {
      cards: cards, info: info, actions: actions,
      trackStyle: 'position: absolute; top: 4px; left: 0; display: flex; gap: ' + GAP + 'px; transition: transform .4s cubic-bezier(.2,.8,.2,1); transform: translateX(' + offset + 'px)',
      balance: w.bal, holds: w.holds
    };
  }
}
</script>
</body>
</html>
