<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NED xStocks — Done</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; background: linear-gradient(170deg, #110822 0%, #0D0618 30%, #080812 60%, #06060E 100%); color: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <div style="position: absolute; top: 140px; left: 50%; margin-left: -170px; width: 340px; height: 300px; background: radial-gradient(circle, rgba(34,197,94,0.18) 0%, transparent 62%); pointer-events: none"></div>

  <!-- Status Bar -->
  <div style="padding: 12px 24px 8px; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2">
    <div style="font-size: 14px; font-weight: 600; color: #FFFFFF">9:41</div>
    <div style="display: flex; gap: 6px; align-items: center">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="4" width="3" height="8" rx="1" fill="#FFFFFF"></rect><rect x="4" y="2" width="3" height="10" rx="1" fill="#FFFFFF"></rect><rect x="8" y="0" width="3" height="12" rx="1" fill="#FFFFFF"></rect><rect x="12" y="2" width="3" height="10" rx="1" fill="rgba(255,255,255,0.25)"></rect></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2" stroke="rgba(255,255,255,0.3)"></rect><rect x="2" y="2" width="15" height="8" rx="1" fill="#22C55E"></rect><rect x="22.5" y="3.5" width="2" height="5" rx="1" fill="rgba(255,255,255,0.3)"></rect></svg>
    </div>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; padding: 64px 24px 0; position: relative; z-index: 1">
    <div style="width: 88px; height: 88px; border-radius: 9999px; background: rgba(34,197,94,0.14); border: 1px solid rgba(34,197,94,0.35); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 40px rgba(34,197,94,0.25)">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#4ADE80" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
    </div>
    <h1 style="margin: 22px 0 0; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.5px; text-align: center">{{title}}</h1>
    <div style="margin-top: 8px; font-size: 14px; line-height: 1.5; color: rgba(255,255,255,0.7); text-align: center">{{message}}</div>

    <div style="margin-top: 14px; display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.3); border-radius: 9999px">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FBBF24" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16v.5"></path></svg>
      <div style="font-size: 11px; font-weight: 600; color: #FBBF24">Demo mode · real price, no real funds moved</div>
    </div>

    <!-- Receipt -->
    <div style="margin-top: 26px; width: 100%; padding: 4px 16px; box-sizing: border-box; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09); border-radius: 18px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
        <div style="{{r.rowStyle}}">
          <div style="font-size: 13px; color: rgba(255,255,255,0.6)">{{r.label}}</div>
          <div style="font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; color: #FFFFFF">{{r.value}}</div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="padding: 0 20px 28px; display: flex; flex-direction: column; gap: 10px; position: relative; z-index: 1">
    <a href="XStockDetail.dc.html" style="height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 16px; background: linear-gradient(135deg, #7B2FBE 0%, #9B4FDE 50%, #6366F1 100%); font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700; color: #FFFFFF; text-decoration: none">View my Apple position</a>
    <a href="XStocksList.dc.html" style="height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 16px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 600; color: #FFFFFF; text-decoration: none">Done</a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"side":{"editor":"enum","options":["buy","sell"],"default":"buy"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var buy = (this.props.side ?? 'buy') !== 'sell';
    var data = buy ? [
      ['Invested', '$50.00'],
      ['Shares received', '0.2049 AAPLx'],
      ['N.E.D fee', '$0.13'],
      ['Time', 'Sat 26 Sep, 01:12']
    ] : [
      ['Sold', '0.2465 AAPLx'],
      ['Added to Cash', '$59.85 USDC'],
      ['N.E.D fee', '$0.15'],
      ['Time', 'Sat 26 Sep, 01:12']
    ];
    var rows = data.map(function (d, i) {
      return { label: d[0], value: d[1], rowStyle: 'display: flex; justify-content: space-between; align-items: center; padding: 11px 0;' + (i < data.length - 1 ? ' border-bottom: 1px solid rgba(255,255,255,0.06)' : '') };
    });
    return {
      title: buy ? 'You now own more Apple' : 'Sale complete',
      message: buy ? 'Your AAPLx is in your wallet and shows under Investments on Home.' : '$59.85 is back in your Cash balance. You still own 0.2535 AAPLx.',
      rows: rows
    };
  }
}
</script>
</body>
</html>
