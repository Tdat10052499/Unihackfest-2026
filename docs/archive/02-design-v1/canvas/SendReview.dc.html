<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NED — Send, review</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#080812}
a{color:#B87AED}a:hover{color:#D4AEF6}
.ned-scroll::-webkit-scrollbar{display:none}
.ned-scroll{scrollbar-width:none;-ms-overflow-style:none}
input::placeholder{color:rgba(255,255,255,0.35)}
@keyframes nedspin{to{transform:rotate(360deg)}}
@keyframes nedbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(170deg, #110822 0%, #0D0618 30%, #080812 60%, #06060E 100%); color: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="padding: 12px 24px 8px; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2">
    <div style="font-size: 14px; font-weight: 600; color: #FFFFFF">9:41</div>
    <div style="display: flex; gap: 6px; align-items: center">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="4" width="3" height="8" rx="1" fill="#FFFFFF"></rect><rect x="4" y="2" width="3" height="10" rx="1" fill="#FFFFFF"></rect><rect x="8" y="0" width="3" height="12" rx="1" fill="#FFFFFF"></rect><rect x="12" y="2" width="3" height="10" rx="1" fill="rgba(255,255,255,0.25)"></rect></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2" stroke="rgba(255,255,255,0.3)"></rect><rect x="2" y="2" width="15" height="8" rx="1" fill="#22C55E"></rect><rect x="22.5" y="3.5" width="2" height="5" rx="1" fill="rgba(255,255,255,0.3)"></rect></svg>
    </div>
  </div>

  <div style="padding: 4px 20px 0; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 2">
    <a href="SendAmount.dc.html" aria-label="Back to amount" style="width: 44px; height: 44px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700">Review</h1>
    <div style="width: 44px; height: 44px"></div>
  </div>
  <div style="padding: 26px 20px 0; text-align: center; position: relative; z-index: 1">
    <div style="font-size: 13px; color: rgba(255,255,255,0.6)">You're sending</div>
    <div style="margin-top: 6px; font-family: 'Space Grotesk', sans-serif; font-size: 48px; font-weight: 700; letter-spacing: -1.6px; line-height: 1">$25.00</div>
    <div style="margin-top: 6px; font-family: 'Space Mono', monospace; font-size: 13px; color: rgba(255,255,255,0.6)">25.00 USDC</div>
  </div>
  <div style="padding: 22px 20px 0; position: relative; z-index: 1">
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1)">
      <div style="{{avatar}}">{{initials}}</div>
      <div style="flex: 1; min-width: 0">
        <div style="font-size: 15px; font-weight: 600">{{name}}</div>
        <div style="margin-top: 2px; font-size: 12px; color: rgba(255,255,255,0.58)">{{handle}} · {{phone}}</div>
      </div>
      <sc-if value="{{unverified}}" hint-placeholder-val="{{ false }}">
        <span style="padding: 3px 8px; border-radius: 9999px; background: rgba(245,158,11,0.14); border: 1px solid rgba(251,191,36,0.35); font-size: 10px; font-weight: 700; color: #FCD34D">UNVERIFIED</span>
      </sc-if>
      <sc-if value="{{verified}}" hint-placeholder-val="{{ true }}">
        <span style="padding: 3px 8px; border-radius: 9999px; background: rgba(155,79,222,0.2); border: 1px solid rgba(184,122,237,0.4); font-size: 10px; font-weight: 700; color: #D8B4FE">N.E.D</span>
      </sc-if>
    </div>
    <div style="margin-top: 12px; padding: 4px 16px; border-radius: 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09)">
      <sc-for list="{{rows}}" as="d" hint-placeholder-count="4">
        <div style="{{d.style}}">
          <span style="font-size: 13px; color: rgba(255,255,255,0.6)">{{d.label}}</span>
          <span style="{{d.valueStyle}}">{{d.value}}</span>
        </div>
      </sc-for>
    </div>
    <sc-if value="{{unverified}}" hint-placeholder-val="{{ false }}">
      <div style="margin-top: 12px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; background: rgba(245,158,11,0.1); border: 1px solid rgba(251,191,36,0.32); border-radius: 14px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" style="flex-shrink: 0; margin-top: 1px" aria-hidden="true"><path d="M12 3 2 20h20L12 3z"></path><path d="M12 10v4M12 17v.5"></path></svg>
        <div style="font-size: 12px; line-height: 1.5; color: rgba(255,255,255,0.85)"><strong style="color: #FCD34D">This number isn't verified.</strong> Make sure {{phone}} really belongs to {{name}}. Payments can't be reversed.</div>
      </div>
    </sc-if>
  </div>
  <div style="flex: 1"></div>
  <div style="padding: 0 20px 28px; position: relative; z-index: 1">
    <a href="SendSuccess.dc.html" style="height: 60px; padding: 5px; box-sizing: border-box; display: flex; align-items: center; border-radius: 9999px; background: linear-gradient(135deg, rgba(123,47,190,0.55), rgba(99,102,241,0.4)); border: 1px solid rgba(155,79,222,0.5); text-decoration: none">
      <div style="width: 50px; height: 50px; border-radius: 9999px; background: linear-gradient(135deg, #9B4FDE, #6366F1); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(123,47,190,0.45); flex-shrink: 0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </div>
      <div style="flex: 1; text-align: center; margin-left: -50px; font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 700; color: #FFFFFF">Slide to send</div>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"recipient":{"editor":"enum","options":["minh","lan"],"default":"minh"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var P = {
      minh: { name: 'Minh Tran', handle: '@minh', phone: '+84 91 •••• 678', initials: 'MT', color: '#0E7490', addr: '9QmT…4ZrB', verified: true },
      lan: { name: 'Lan Pham', handle: '@lanpham', phone: '+84 90 •••• 567', initials: 'LP', color: '#9D174D', addr: '3kWd…8NpA', verified: false }
    };
    var who = P[this.props.recipient ?? 'minh'] || P.minh;
    var mono = "font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; color: #FFFFFF";
    var plain = 'font-size: 13px; font-weight: 600; color: #FFFFFF';
    var data = [
      ['From', 'Cash · USDC', plain],
      ['To wallet', who.addr, mono],
      ['Note', 'Coffee', plain],
      ['Network fee', 'Free · paid by N.E.D', 'font-size: 13px; font-weight: 600; color: #86EFAC'],
      ['Arrives', 'In a few seconds', plain]
    ];
    var rows = data.map(function (d, i) {
      return { label: d[0], value: d[1], valueStyle: d[2], style: 'display: flex; justify-content: space-between; align-items: center; padding: 11px 0;' + (i < data.length - 1 ? ' border-bottom: 1px solid rgba(255,255,255,0.06)' : '') };
    });
    return {
      name: who.name, handle: who.handle, phone: who.phone, initials: who.initials,
      verified: who.verified, unverified: !who.verified,
      avatar: 'width: 44px; height: 44px; border-radius: 9999px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: \'Space Grotesk\', sans-serif; font-size: 15px; font-weight: 700; color: #FFFFFF; background: ' + who.color,
      rows: rows
    };
  }
}
</script>
</body>
</html>
