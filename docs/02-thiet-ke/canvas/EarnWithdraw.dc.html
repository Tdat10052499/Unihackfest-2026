<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NED — Earn, withdraw</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#080812}
a{color:#B87AED}a:hover{color:#D4AEF6}
.ned-scroll::-webkit-scrollbar{display:none}
.ned-scroll{scrollbar-width:none;-ms-overflow-style:none}
input::placeholder{color:rgba(255,255,255,0.35)}
@keyframes nedspin{to{transform:rotate(360deg)}}
@keyframes nedbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(170deg, #110822 0%, #0D0618 30%, #080812 60%, #06060E 100%); color: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="padding: 12px 24px 8px; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2">
    <div style="font-size: 14px; font-weight: 600; color: #FFFFFF">9:41</div>
    <div style="display: flex; gap: 6px; align-items: center">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="4" width="3" height="8" rx="1" fill="#FFFFFF"></rect><rect x="4" y="2" width="3" height="10" rx="1" fill="#FFFFFF"></rect><rect x="8" y="0" width="3" height="12" rx="1" fill="#FFFFFF"></rect><rect x="12" y="2" width="3" height="10" rx="1" fill="rgba(255,255,255,0.25)"></rect></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2" stroke="rgba(255,255,255,0.3)"></rect><rect x="2" y="2" width="15" height="8" rx="1" fill="#22C55E"></rect><rect x="22.5" y="3.5" width="2" height="5" rx="1" fill="rgba(255,255,255,0.3)"></rect></svg>
    </div>
  </div>
  <div style="padding: 4px 20px 0; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 2">
    <a href="EarnHome.dc.html" aria-label="Back to Simple Earn" style="width: 44px; height: 44px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700">Withdraw</h1>
    <div style="width: 44px; height: 44px"></div>
  </div>

  <div style="padding: 20px 20px 0; text-align: center; position: relative; z-index: 1">
    <div style="font-size: 12px; color: rgba(255,255,255,0.6)">In Earn · $503.42</div>
    <div style="margin-top: 6px; font-family: 'Space Grotesk', sans-serif; font-size: 52px; font-weight: 700; letter-spacing: -2px; line-height: 1.05">${{amount}}</div>
    <div style="{{hintStyle}}">{{hint}}</div>
  </div>
  <div style="margin: 14px 20px 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; position: relative; z-index: 1">
    <sc-for list="{{quick}}" as="c" hint-placeholder-count="4">
      <button onClick="{{c.pick}}" style="height: 38px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); color: #FFFFFF; font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer">{{c.label}}</button>
    </sc-for>
  </div>
  <sc-if value="{{limited}}" hint-placeholder-val="{{ false }}">
    <div style="margin: 12px 20px 0; padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start; border-radius: 14px; background: rgba(245,158,11,0.1); border: 1px solid rgba(251,191,36,0.32); position: relative; z-index: 1">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" style="flex-shrink: 0; margin-top: 1px" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      <div style="font-size: 12px; line-height: 1.5; color: rgba(255,255,255,0.85)"><strong style="color: #FCD34D">Only $180.00 can be withdrawn right now.</strong> The pool is busy. The rest usually frees up within a few hours, and keeps earning meanwhile.</div>
    </div>
  </sc-if>
  <div style="margin: 12px 20px 0; padding: 2px 14px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09); position: relative; z-index: 1">
    <sc-for list="{{rows}}" as="d" hint-placeholder-count="3">
      <div style="{{d.style}}">
        <span style="font-size: 12px; color: rgba(255,255,255,0.6)">{{d.k}}</span>
        <span style="{{d.vs}}">{{d.v}}</span>
      </div>
    </sc-for>
  </div>
  <div style="flex: 1"></div>
  <div style="padding: 0 20px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; position: relative; z-index: 1">
    <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
      <button onClick="{{k.press}}" aria-label="{{k.aria}}" style="height: 50px; background: transparent; border: none; border-radius: 12px; cursor: pointer; color: #FFFFFF; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 500">{{k.label}}</button>
    </sc-for>
  </div>
  <div style="padding: 8px 20px 28px; position: relative; z-index: 1">
    <sc-if value="{{ready}}" hint-placeholder-val="{{ true }}">
      <a href="EarnWithdrawSuccess.dc.html" style="height: 60px; padding: 5px; box-sizing: border-box; display: flex; align-items: center; border-radius: 9999px; background: linear-gradient(135deg, rgba(22,163,74,0.5), rgba(99,102,241,0.4)); border: 1px solid rgba(134,239,172,0.45); text-decoration: none">
        <div style="width: 50px; height: 50px; border-radius: 9999px; background: linear-gradient(135deg, #22C55E, #6366F1); display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 4px 14px rgba(22,163,74,0.4)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
        </div>
        <div style="flex: 1; text-align: center; margin-left: -50px; font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 700; color: #FFFFFF">Slide to withdraw</div>
      </a>
    </sc-if>
    <sc-if value="{{notReady}}" hint-placeholder-val="{{ false }}">
      <div aria-disabled="true" style="height: 60px; border-radius: 9999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.45)">Slide to withdraw</div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"limited":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { amt: '100' }; }
  renderVals() {
    var self = this;
    function press(k) {
      var a = self.state.amt;
      if (k === 'del') a = a.length > 1 ? a.slice(0, -1) : '0';
      else if (k === '.') { if (a.indexOf('.') < 0) a = a + '.'; }
      else {
        if (a === '0') a = k;
        else if (a.indexOf('.') >= 0 && a.split('.')[1].length >= 2) return;
        else if (a.replace('.', '').length >= 7) return;
        else a = a + k;
      }
      self.setState({ amt: a });
    }
    var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '.', '0', 'del'].map(function (k) {
      return { label: k === 'del' ? '⌫' : k, aria: k === 'del' ? 'Delete' : (k === '.' ? 'Decimal point' : k), press: function () { press(k); } };
    });
    function money(n) { return '$' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
    var mono = "font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; color: #FFFFFF";
    function mk(list) { return list.map(function (d, i) { return { k: d[0], v: d[1], vs: d[2] || mono, style: 'display: flex; justify-content: space-between; align-items: center; padding: 9px 0;' + (i < list.length - 1 ? ' border-bottom: 1px solid rgba(255,255,255,0.06)' : '') }; }); }
    var limited = this.props.limited ?? false;
    var inEarn = 503.42, avail = limited ? 180 : inEarn, v = parseFloat(this.state.amt) || 0;
    var over = v > avail + 0.001, ready = v > 0 && !over;
    var quick = [['25%', 0.25], ['50%', 0.5], ['75%', 0.75], ['All', 1]].map(function (q) { return { label: q[0], pick: function () { self.setState({ amt: String(+(Math.min(inEarn * q[1], avail)).toFixed(2)) }); } }; });
    return {
      amount: this.state.amt, keys: keys, quick: quick, ready: ready, notReady: !ready, limited: limited,
      hint: over ? (limited ? 'Max available right now: ' + money(avail) : 'More than you have in Earn') : 'Goes back to your Cash',
      hintStyle: 'margin-top: 8px; font-size: 13px; font-weight: ' + (over ? '600' : '400') + '; color: ' + (over ? '#F87171' : 'rgba(255,255,255,0.65)'),
      rows: mk([['Available now', money(avail)], ['You receive', money(v) + ' USDC'], ['Fee', 'Free', 'font-size: 13px; font-weight: 700; color: #86EFAC']])
    };
  }
}
</script>
</body>
</html>
