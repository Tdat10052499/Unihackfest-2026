<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NED — T.E.D, plan my money</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#080812}
a{color:#B87AED}a:hover{color:#D4AEF6}
.ned-scroll::-webkit-scrollbar{display:none}
.ned-scroll{scrollbar-width:none;-ms-overflow-style:none}
input::placeholder{color:rgba(255,255,255,0.35)}
@keyframes nedspin{to{transform:rotate(360deg)}}
@keyframes nedbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(170deg, #110822 0%, #0D0618 30%, #080812 60%, #06060E 100%); color: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="padding: 12px 24px 8px; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2">
    <div style="font-size: 14px; font-weight: 600; color: #FFFFFF">9:41</div>
    <div style="display: flex; gap: 6px; align-items: center">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="4" width="3" height="8" rx="1" fill="#FFFFFF"></rect><rect x="4" y="2" width="3" height="10" rx="1" fill="#FFFFFF"></rect><rect x="8" y="0" width="3" height="12" rx="1" fill="#FFFFFF"></rect><rect x="12" y="2" width="3" height="10" rx="1" fill="rgba(255,255,255,0.25)"></rect></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2" stroke="rgba(255,255,255,0.3)"></rect><rect x="2" y="2" width="15" height="8" rx="1" fill="#22C55E"></rect><rect x="22.5" y="3.5" width="2" height="5" rx="1" fill="rgba(255,255,255,0.3)"></rect></svg>
    </div>
  </div>
  <div style="padding: 4px 16px 12px; display: flex; align-items: center; gap: 10px; position: relative; z-index: 3; border-bottom: 1px solid rgba(255,255,255,0.06)">
    <a href="TEDBotV1.dc.html" aria-label="Back" style="width: 44px; height: 44px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <div aria-hidden="true" style="width: 38px; height: 38px; background: linear-gradient(135deg, #7B2FBE, #6366F1); border-radius: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; position: relative">
      <svg width="18" height="16" viewBox="0 0 20 18" fill="none"><ellipse cx="10" cy="9" rx="8" ry="7" fill="rgba(255,255,255,0.9)"></ellipse><ellipse cx="10" cy="11" rx="4.5" ry="3.5" fill="#F0E4FF"></ellipse><circle cx="7.5" cy="7.5" r="1.2" fill="#7B2FBE"></circle><circle cx="12.5" cy="7.5" r="1.2" fill="#7B2FBE"></circle><ellipse cx="5" cy="3" rx="3" ry="2.5" fill="rgba(255,255,255,0.9)"></ellipse><ellipse cx="15" cy="3" rx="3" ry="2.5" fill="rgba(255,255,255,0.9)"></ellipse></svg>
    </div>
    <div style="flex: 1; min-width: 0">
      <div style="font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 700">T.E.D</div>
      <div style="margin-top: 1px; font-size: 12px; color: rgba(255,255,255,0.6)">Plan my money · {{progress}}</div>
    </div>
  </div>

  <div style="flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column-reverse; position: relative; z-index: 1">
    <div style="padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 12px">
      <sc-for list="{{msgs}}" as="m" hint-placeholder-count="6">
        <sc-if value="{{m.isTed}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; gap: 10px; align-items: flex-start"><div aria-hidden="true" style="width: 28px; height: 28px; background: linear-gradient(135deg, #7B2FBE, #6366F1); border-radius: 9px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px"><svg width="12" height="10" viewBox="0 0 20 18" fill="none"><ellipse cx="10" cy="9" rx="7" ry="6" fill="rgba(255,255,255,0.85)"></ellipse><circle cx="7.5" cy="7.5" r="1" fill="#7B2FBE"></circle><circle cx="12.5" cy="7.5" r="1" fill="#7B2FBE"></circle><ellipse cx="5.5" cy="4" rx="2.5" ry="2" fill="rgba(255,255,255,0.85)"></ellipse><ellipse cx="14.5" cy="4" rx="2.5" ry="2" fill="rgba(255,255,255,0.85)"></ellipse></svg></div><div style="flex: 1; min-width: 0"><div style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 2px 16px 16px 16px; padding: 12px 14px; font-size: 14px; line-height: 1.55; color: rgba(255,255,255,0.88)">{{m.text}}</div></div></div>
        </sc-if>
        <sc-if value="{{m.isUser}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; justify-content: flex-end"><div style="max-width: 270px; background: linear-gradient(135deg, rgba(123,47,190,0.45), rgba(99,102,241,0.32)); border: 1px solid rgba(123,47,190,0.3); border-radius: 16px 2px 16px 16px; padding: 11px 14px; font-size: 14px; line-height: 1.5; color: #FFFFFF">{{m.text}}</div></div>
        </sc-if>
        <sc-if value="{{m.isCard}}" hint-placeholder-val="{{ false }}">
          <div style="margin-left: 38px; padding: 12px 14px; border-radius: 16px; background: rgba(251,191,36,0.07); border: 1px solid rgba(251,191,36,0.3)">
            <div style="display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.6px; color: #FCD34D"><svg width="11" height="11" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 0L7.2 4.8 12 6 7.2 7.2 6 12 4.8 7.2 0 6 4.8 4.8Z" fill="#FBBF24"></path></svg> UNDERSTOOD FROM YOUR MESSAGE</div>
            <div style="margin-top: 8px; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px">
              <span style="color: rgba(255,255,255,0.6)">What</span><span style="font-weight: 600">Tuition payment</span>
              <span style="color: rgba(255,255,255,0.6)">Amount</span><span style="font-weight: 600">5,000,000 VND <span style="font-weight: 400; color: rgba(255,255,255,0.6)">≈ $190</span></span>
              <span style="color: rgba(255,255,255,0.6)">When</span><span style="font-weight: 600">By December 2026</span>
            </div>
            <button style="margin-top: 10px; height: 34px; padding: 0 12px; border-radius: 10px; background: transparent; border: 1px solid rgba(255,255,255,0.18); color: rgba(255,255,255,0.85); font-size: 12px; font-weight: 600; cursor: pointer">Not right? Edit</button>
          </div>
        </sc-if>
      </sc-for>
      <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
        <a href="TEDPlanResult.dc.html" style="margin-left: 38px; height: 56px; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 16px; background: linear-gradient(135deg, #7B2FBE 0%, #9B4FDE 50%, #6366F1 100%); font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700; color: #FFFFFF; text-decoration: none">See my plan</a>
      </sc-if>
    </div>
  </div>

  <sc-if value="{{hasChips}}" hint-placeholder-val="{{ true }}">
    <div style="padding: 0 16px 10px 54px; display: flex; flex-wrap: wrap; gap: 8px; position: relative; z-index: 2">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
        <button onClick="{{c.pick}}" style="min-height: 40px; padding: 0 14px; border-radius: 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.14); color: #FFFFFF; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; text-decoration: none">{{c.label}}</button>
      </sc-for>
    </div>
  </sc-if>

  <div style="padding: 10px 16px 28px; border-top: 1px solid rgba(255,255,255,0.06); background: rgba(10,10,18,0.95); position: relative; z-index: 2">
    <div style="display: flex; align-items: center; gap: 10px">
      <input aria-label="Your answer" value="{{draft}}" onChange="{{onDraft}}" placeholder="{{placeholder}}" style="flex: 1; min-width: 0; height: 46px; box-sizing: border-box; padding: 0 18px; border-radius: 23px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: #FFFFFF; font-family: 'Inter', sans-serif; font-size: 14px; outline: none">
      <button onClick="{{send}}" aria-label="Send" style="width: 46px; height: 46px; background: linear-gradient(135deg, #7B2FBE, #6366F1); border: none; border-radius: 9999px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"></path></svg></button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"start":{"editor":"enum","options":["0","3","5"],"default":"3"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    var n = parseInt(props.start ?? '3', 10) || 0;
    var A = ['Saving for something', '3–12 months', 'Tháng 12 mình cần 5 triệu đóng học phí', 'Wait it out', 'Never'];
    this.state = { answers: A.slice(0, n), draft: n === 2 ? A[2] : '' };
  }
  renderVals() {
    var self = this;
    var Q = [
      { q: 'What is this money mainly for?', chips: ['Everyday spending', 'Saving for something', 'Growing over years'] },
      { q: 'When might you need most of it?', chips: ['Within 3 months', '3–12 months', 'After a year'] },
      { q: 'Any big payment coming up? Tell me in your own words, in English or Vietnamese.', chips: ['Nothing planned'] },
      { q: 'If your investments dropped 20% in a month, what would you do?', chips: ['Sell to stop losing', 'Wait it out', 'Buy more'] },
      { q: 'Last one: have you invested before?', chips: ['Never', 'A little', 'Yes, often'] }
    ];
    var ans = this.state.answers, n = ans.length;
    var msgs = [{ isTed: true, isUser: false, isCard: false, text: "Let's plan your $871.71. I'll ask 5 quick questions, then suggest how to split it between Cash, Earn and xStocks using live rates from Jupiter. You decide what to do." }];
    for (var i = 0; i < n; i++) {
      msgs.push({ isTed: true, isUser: false, isCard: false, text: Q[i].q });
      msgs.push({ isTed: false, isUser: true, isCard: false, text: ans[i] });
      if (i === 2 && ans[i] !== 'Nothing planned') {
        msgs.push({ isTed: false, isUser: false, isCard: true, text: '' });
        msgs.push({ isTed: true, isUser: false, isCard: false, text: "Got it. I'll keep about $190 in Cash so tuition is covered." });
      }
    }
    var done = n >= 5;
    if (done) msgs.push({ isTed: true, isUser: false, isCard: false, text: 'Thanks! Your plan is ready. It uses your answers, your balances and the current Earn rate.' });
    else msgs.push({ isTed: true, isUser: false, isCard: false, text: Q[n].q });
    function answer(t) { var a = self.state.answers.concat([t]); self.setState({ answers: a, draft: a.length === 2 ? 'Tháng 12 mình cần 5 triệu đóng học phí' : '' }); }
    var chips = done ? [] : Q[n].chips.map(function (c) { return { label: c, pick: function () { answer(c); } }; });
    return {
      msgs: msgs, done: done, chips: chips, hasChips: chips.length > 0,
      progress: done ? 'done' : (n + 1) + ' of 5',
      draft: this.state.draft, onDraft: function (e) { self.setState({ draft: e.target.value }); },
      placeholder: n === 2 ? 'Type your answer…' : 'Or type your own answer…',
      send: function () { var t = (self.state.draft || '').trim(); if (t && self.state.answers.length < 5) answer(t); }
    };
  }
}
</script>
</body>
</html>
