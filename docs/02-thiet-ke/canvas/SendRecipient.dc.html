<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NED — Send, choose recipient</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#080812}
a{color:#B87AED}a:hover{color:#D4AEF6}
.ned-scroll::-webkit-scrollbar{display:none}
.ned-scroll{scrollbar-width:none;-ms-overflow-style:none}
input::placeholder{color:rgba(255,255,255,0.35)}
@keyframes nedspin{to{transform:rotate(360deg)}}
@keyframes nedbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(170deg, #110822 0%, #0D0618 30%, #080812 60%, #06060E 100%); color: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="padding: 12px 24px 8px; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2">
    <div style="font-size: 14px; font-weight: 600; color: #FFFFFF">9:41</div>
    <div style="display: flex; gap: 6px; align-items: center">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="4" width="3" height="8" rx="1" fill="#FFFFFF"></rect><rect x="4" y="2" width="3" height="10" rx="1" fill="#FFFFFF"></rect><rect x="8" y="0" width="3" height="12" rx="1" fill="#FFFFFF"></rect><rect x="12" y="2" width="3" height="10" rx="1" fill="rgba(255,255,255,0.25)"></rect></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2" stroke="rgba(255,255,255,0.3)"></rect><rect x="2" y="2" width="15" height="8" rx="1" fill="#22C55E"></rect><rect x="22.5" y="3.5" width="2" height="5" rx="1" fill="rgba(255,255,255,0.3)"></rect></svg>
    </div>
  </div>

  <div style="padding: 4px 20px 0; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 2">
    <a href="HomeV4.dc.html" aria-label="Back to Home" style="width: 44px; height: 44px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700">Send</h1>
    <button aria-label="Scan a QR code" style="width: 44px; height: 44px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3M7 12h10"></path></svg>
    </button>
  </div>
  <div style="padding: 16px 20px 0; position: relative; z-index: 1">
    <label for="send-q" style="display: block; font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.8)">To</label>
    <div style="margin-top: 8px; display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 14px; border-radius: 16px; background: rgba(255,255,255,0.06); border: 1px solid rgba(155,79,222,0.5); box-shadow: 0 0 0 4px rgba(155,79,222,0.12)">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input id="send-q" value="{{q}}" onChange="{{onQ}}" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Phone, @username or name.sol" style="flex: 1; min-width: 0; height: 50px; background: transparent; border: none; outline: none; color: #FFFFFF; font-family: 'Inter', sans-serif; font-size: 16px">
      <sc-if value="{{hasQ}}" hint-placeholder-val="{{ false }}">
        <button onClick="{{clear}}" aria-label="Clear" style="width: 32px; height: 32px; border-radius: 9999px; background: rgba(255,255,255,0.1); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </sc-if>
    </div>
    <div aria-live="polite" style="margin-top: 8px; font-size: 12px; color: rgba(255,255,255,0.55)">{{modeHint}}</div>
  </div>

  <div class="ned-scroll" style="flex: 1; overflow-y: auto; padding: 8px 20px 24px; position: relative; z-index: 1">
    <sc-if value="{{showList}}" hint-placeholder-val="{{ true }}">
      <div style="margin-top: 10px; font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: rgba(255,255,255,0.5)">{{listTitle}}</div>
      <sc-for list="{{results}}" as="r" hint-placeholder-count="3">
        <a href="SendAmount.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.06); text-decoration: none; color: #FFFFFF">
          <div style="{{r.avatar}}">{{r.initials}}</div>
          <div style="flex: 1; min-width: 0">
            <div style="display: flex; align-items: center; gap: 8px">
              <span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span>
              <sc-if value="{{r.isNed}}" hint-placeholder-val="{{ true }}">
                <span style="padding: 2px 7px; border-radius: 9999px; background: rgba(155,79,222,0.2); border: 1px solid rgba(184,122,237,0.4); font-size: 10px; font-weight: 700; letter-spacing: 0.4px; color: #D8B4FE">N.E.D</span>
              </sc-if>
              <sc-if value="{{r.isSns}}" hint-placeholder-val="{{ false }}">
                <span style="padding: 2px 7px; border-radius: 9999px; background: rgba(99,102,241,0.2); border: 1px solid rgba(129,140,248,0.4); font-size: 10px; font-weight: 700; letter-spacing: 0.4px; color: #C7D2FE">.SOL ✓</span>
              </sc-if>
            </div>
            <div style="margin-top: 2px; font-size: 13px; color: rgba(255,255,255,0.58)">{{r.sub}}</div>
            <sc-if value="{{r.unverified}}" hint-placeholder-val="{{ false }}">
              <div style="margin-top: 5px; display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 9999px; background: rgba(245,158,11,0.14); border: 1px solid rgba(251,191,36,0.35); font-size: 11px; font-weight: 600; color: #FCD34D">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#FCD34D" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 3 2 20h20L12 3z"></path><path d="M12 10v4"></path></svg>
                Unverified number
              </div>
            </sc-if>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
        </a>
      </sc-for>
    </sc-if>

    <sc-if value="{{notFound}}" hint-placeholder-val="{{ false }}">
      <div style="margin-top: 24px; display: flex; flex-direction: column; align-items: center; text-align: center">
        <img src="/_blob/195e0aeefc275136e89ec220d2c399a1" alt="" style="width: 150px; height: 118px; object-fit: contain">
        <div style="margin-top: 14px; font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700">Hmm, I couldn't find “{{q}}”</div>
        <div style="margin-top: 6px; max-width: 290px; font-size: 13px; line-height: 1.5; color: rgba(255,255,255,0.62)">Check the spelling, or paste their full Solana wallet address.</div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { q: '' }; }
  renderVals() {
    var self = this;
    var people = [
      { name: 'Minh Tran', handle: '@minh', phone: '912345678', phoneMask: '+84 91 •••• 678', initials: 'MT', color: '#0E7490', kind: 'ned', verified: true },
      { name: 'Lan Pham', handle: '@lanpham', phone: '901234567', phoneMask: '+84 90 •••• 567', initials: 'LP', color: '#9D174D', kind: 'ned', verified: false },
      { name: 'anna.sol', handle: 'Solana name', phone: '', initials: 'A', color: '#4338CA', kind: 'sns', sns: 'anna.sol' }
    ];
    var raw = (this.state.q || '').trim();
    var q = raw.toLowerCase();
    var digits = q.replace(/[^0-9]/g, '').replace(/^84/, '').replace(/^0/, '');
    var mode = 'none', hits = [], hint = 'Search by phone number, N.E.D username or .sol name.';
    if (!q) { mode = 'recent'; hits = people; }
    else if (/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(raw)) {
      mode = 'address'; hint = 'Looks like a Solana wallet address.';
      hits = [{ name: raw.slice(0, 4) + '…' + raw.slice(-4), handle: 'Wallet address', initials: '◎', color: '#374151', kind: 'addr' }];
    }
    else if (q.indexOf('.sol') > 0 || q.indexOf('.') > 0) {
      mode = 'sns'; hint = 'Searching Solana names (.sol)';
      hits = people.filter(function (p) { return p.sns && p.sns.indexOf(q) === 0; });
    }
    else if (/^[+0-9 ]+$/.test(q)) {
      mode = 'phone';
      if (digits.length < 9) { hint = 'Keep typing the phone number…'; mode = 'typing'; }
      else { hint = 'Searching N.E.D by phone number'; hits = people.filter(function (p) { return p.phone && p.phone === digits; }); }
    }
    else {
      mode = 'user'; hint = 'Searching N.E.D usernames';
      var u = q.replace(/^@/, '');
      hits = people.filter(function (p) { return p.kind === 'ned' && (p.handle.slice(1).indexOf(u) === 0 || p.name.toLowerCase().indexOf(u) === 0); });
    }
    var results = hits.map(function (p) {
      var sub = p.kind === 'ned' ? p.handle + ' · ' + p.phoneMask : (p.kind === 'sns' ? 'Solana name · 8Fp3…Qx2L' : p.handle);
      return {
        name: p.name, initials: p.initials, sub: sub,
        isNed: p.kind === 'ned', isSns: p.kind === 'sns',
        unverified: p.kind === 'ned' && !p.verified && (mode === 'recent' || mode === 'phone'),
        avatar: 'width: 44px; height: 44px; border-radius: 9999px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: \'Space Grotesk\', sans-serif; font-size: 15px; font-weight: 700; color: #FFFFFF; background: ' + p.color
      };
    });
    var found = results.length > 0;
    return {
      q: this.state.q, hasQ: !!q,
      onQ: function (e) { self.setState({ q: e.target.value }); },
      clear: function () { self.setState({ q: '' }); },
      modeHint: hint,
      listTitle: mode === 'recent' ? 'Recent' : (found ? 'Found' : ''),
      results: results,
      showList: found && mode !== 'typing',
      notFound: !found && mode !== 'typing' && mode !== 'recent'
    };
  }
}
</script>
</body>
</html>
