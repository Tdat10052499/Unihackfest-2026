<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NED — Choose wallet mode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#080812}
a{color:#B87AED}a:hover{color:#D4AEF6}
.ned-scroll::-webkit-scrollbar{display:none}
.ned-scroll{scrollbar-width:none;-ms-overflow-style:none}
input::placeholder{color:rgba(255,255,255,0.35)}
@keyframes nedspin{to{transform:rotate(360deg)}}
@keyframes nedbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(170deg, #110822 0%, #0D0618 30%, #080812 60%, #06060E 100%); color: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="padding: 12px 24px 8px; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2">
    <div style="font-size: 14px; font-weight: 600; color: #FFFFFF">9:41</div>
    <div style="display: flex; gap: 6px; align-items: center">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="4" width="3" height="8" rx="1" fill="#FFFFFF"></rect><rect x="4" y="2" width="3" height="10" rx="1" fill="#FFFFFF"></rect><rect x="8" y="0" width="3" height="12" rx="1" fill="#FFFFFF"></rect><rect x="12" y="2" width="3" height="10" rx="1" fill="rgba(255,255,255,0.25)"></rect></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2" stroke="rgba(255,255,255,0.3)"></rect><rect x="2" y="2" width="15" height="8" rx="1" fill="#22C55E"></rect><rect x="22.5" y="3.5" width="2" height="5" rx="1" fill="rgba(255,255,255,0.3)"></rect></svg>
    </div>
  </div>

  <div style="padding: 4px 20px 0; display: flex; align-items: center; gap: 14px; position: relative; z-index: 2">
    <a href="OnbProfile.dc.html" aria-label="Back" style="width: 44px; height: 44px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <div role="progressbar" aria-valuemin="1" aria-valuemax="2" aria-valuenow="2" aria-label="Step 2 of 2" style="flex: 1; display: flex; gap: 6px"><div style="flex: 1; height: 4px; border-radius: 9999px; background: #9B4FDE"></div><div style="flex: 1; height: 4px; border-radius: 9999px; background: #9B4FDE"></div></div>
  </div>
  <div style="flex: 1; padding: 22px 24px 0; display: flex; flex-direction: column; position: relative; z-index: 1">
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.6px">How do you want to<br>see your money?</h1>
    <p style="margin: 8px 0 0; font-size: 14px; line-height: 1.5; color: rgba(255,255,255,0.68)">You can switch anytime from Home.</p>
    <div role="radiogroup" aria-label="Wallet mode" style="margin-top: 24px; display: flex; flex-direction: column; gap: 12px">
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
        <button role="radio" aria-checked="{{m.checked}}" onClick="{{m.pick}}" style="{{m.style}}">
          <div style="display: flex; align-items: center; gap: 12px">
            <div style="{{m.iconBox}}">
              <sc-if value="{{m.isCash}}" hint-placeholder-val="{{ true }}">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="12" cy="12" r="2.5"></circle><path d="M6 12h.01M18 12h.01"></path></svg>
              </sc-if>
              <sc-if value="{{m.isCrypto}}" hint-placeholder-val="{{ false }}">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="5"></circle><circle cx="16" cy="16" r="5"></circle></svg>
              </sc-if>
            </div>
            <div style="flex: 1; min-width: 0; text-align: left">
              <div style="display: flex; align-items: center; gap: 8px">
                <span style="font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700; color: #FFFFFF">{{m.title}}</span>
                <sc-if value="{{m.recommended}}" hint-placeholder-val="{{ true }}">
                  <span style="padding: 2px 8px; border-radius: 9999px; background: rgba(74,222,128,0.14); border: 1px solid rgba(74,222,128,0.35); font-size: 10px; font-weight: 700; letter-spacing: 0.4px; color: #86EFAC">RECOMMENDED</span>
                </sc-if>
              </div>
              <div style="margin-top: 4px; font-size: 13px; line-height: 1.45; color: rgba(255,255,255,0.7)">{{m.desc}}</div>
            </div>
            <div style="{{m.radio}}"><div style="{{m.radioDot}}"></div></div>
          </div>
          <div style="margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-between; align-items: center; text-align: left">
            <span style="font-size: 11px; color: rgba(255,255,255,0.55)">{{m.previewLabel}}</span>
            <span style="font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; color: #FFFFFF">{{m.preview}}</span>
          </div>
        </button>
      </sc-for>
    </div>
    <div style="flex: 1"></div>
    <div style="padding-bottom: 28px">
      <a href="HomeV4.dc.html" style="height: 56px; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 16px; background: linear-gradient(135deg, #7B2FBE 0%, #9B4FDE 50%, #6366F1 100%); font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700; color: #FFFFFF; text-decoration: none">Continue</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: 'cash' }; }
  renderVals() {
    var self = this;
    var defs = [
      { id: 'cash', title: 'Simple', desc: 'One balance in dollars. We handle the crypto for you.', previewLabel: 'Home shows', preview: 'Cash $250.00', recommended: true },
      { id: 'crypto', title: 'Crypto', desc: 'See every token you hold and choose what you pay with.', previewLabel: 'Home shows', preview: 'SOL · USDC · AAPLx', recommended: false }
    ];
    var modes = defs.map(function (d) {
      var on = d.id === self.state.mode;
      return {
        title: d.title, desc: d.desc, previewLabel: d.previewLabel, preview: d.preview, recommended: d.recommended,
        isCash: d.id === 'cash', isCrypto: d.id === 'crypto',
        checked: on ? 'true' : 'false',
        pick: function () { self.setState({ mode: d.id }); },
        style: 'width: 100%; padding: 16px; border-radius: 18px; cursor: pointer; font-family: inherit; ' + (on ? 'background: rgba(123,47,190,0.2); border: 1.5px solid #9B4FDE; box-shadow: 0 0 0 4px rgba(155,79,222,0.14)' : 'background: rgba(255,255,255,0.04); border: 1.5px solid rgba(255,255,255,0.12)'),
        iconBox: 'width: 44px; height: 44px; border-radius: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: ' + (on ? 'linear-gradient(135deg, #7B2FBE, #6366F1)' : 'rgba(255,255,255,0.08)'),
        radio: 'width: 22px; height: 22px; box-sizing: border-box; border-radius: 9999px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 2px solid ' + (on ? '#B87AED' : 'rgba(255,255,255,0.3)'),
        radioDot: 'width: 10px; height: 10px; border-radius: 9999px; background: ' + (on ? '#B87AED' : 'transparent')
      };
    });
    return { modes: modes };
  }
}
</script>
</body>
</html>
