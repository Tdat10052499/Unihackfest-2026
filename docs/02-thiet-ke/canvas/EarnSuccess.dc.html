<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NED — Earn, done</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; background: linear-gradient(170deg, #110822 0%, #0D0618 30%, #080812 60%, #06060E 100%); color: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="position: absolute; top: 130px; left: 50%; margin-left: -170px; width: 340px; height: 300px; background: radial-gradient(circle, rgba(34,197,94,0.18) 0%, transparent 62%); pointer-events: none"></div>
  <div style="padding: 12px 24px 8px; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2">
    <div style="font-size: 14px; font-weight: 600; color: #FFFFFF">9:41</div>
    <div style="display: flex; gap: 6px; align-items: center">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="4" width="3" height="8" rx="1" fill="#FFFFFF"></rect><rect x="4" y="2" width="3" height="10" rx="1" fill="#FFFFFF"></rect><rect x="8" y="0" width="3" height="12" rx="1" fill="#FFFFFF"></rect><rect x="12" y="2" width="3" height="10" rx="1" fill="rgba(255,255,255,0.25)"></rect></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2" stroke="rgba(255,255,255,0.3)"></rect><rect x="2" y="2" width="15" height="8" rx="1" fill="#22C55E"></rect><rect x="22.5" y="3.5" width="2" height="5" rx="1" fill="rgba(255,255,255,0.3)"></rect></svg>
    </div>
  </div>
  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; padding: 56px 24px 0; position: relative; z-index: 1">
    <img src="/_blob/22f5490f03888bc46a04dbf909a17ab4" alt="" style="width: 190px; height: 132px; object-fit: contain">
    <h1 style="margin: 20px 0 0; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; text-align: center">{{title}}</h1>
    <div style="margin-top: 8px; font-size: 14px; line-height: 1.5; text-align: center; color: rgba(255,255,255,0.72)">{{message}}</div>
    <div style="margin-top: 14px; display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.3); border-radius: 9999px">
      <div style="font-size: 11px; font-weight: 600; color: #FBBF24">Demo mode · real rate, no real funds moved</div>
    </div>
    <div style="margin-top: 22px; width: 100%; padding: 4px 16px; box-sizing: border-box; border-radius: 18px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09)">
      <sc-for list="{{rows}}" as="d" hint-placeholder-count="4">
        <div style="{{d.style}}">
          <span style="font-size: 13px; color: rgba(255,255,255,0.6)">{{d.k}}</span>
          <span style="font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700">{{d.v}}</span>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="padding: 0 20px 28px; display: flex; flex-direction: column; gap: 10px; position: relative; z-index: 1">
    <a href="EarnHome.dc.html" style="height: 56px; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 16px; background: linear-gradient(135deg, #7B2FBE 0%, #9B4FDE 50%, #6366F1 100%); font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700; color: #FFFFFF; text-decoration: none">View Simple Earn</a>
    <a href="HomeV4.dc.html" style="height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 16px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 600; color: #FFFFFF; text-decoration: none">Done</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"side":{"editor":"enum","options":["deposit","withdraw"],"default":"deposit"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var dep = (this.props.side ?? 'deposit') !== 'withdraw';
    var data = dep ? [['Deposited', '$250.00'], ['Rate', '4.0% APY'], ['Est. per month', '+$0.83'], ['Now in Earn', '$753.42']] : [['Withdrawn', '$100.00'], ['Added to Cash', '100.00 USDC'], ['Fee', '$0.00'], ['Still in Earn', '$403.42']];
    var rows = data.map(function (d, i) { return { k: d[0], v: d[1], style: 'display: flex; justify-content: space-between; align-items: center; padding: 11px 0;' + (i < data.length - 1 ? ' border-bottom: 1px solid rgba(255,255,255,0.06)' : '') }; });
    return {
      title: dep ? "You're earning!" : 'Back in your Cash',
      message: dep ? 'Your $250.00 started earning interest this second.' : '$100.00 is ready to spend or send.',
      rows: rows
    };
  }
}
</script>
</body>
</html>
