<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NED — Released</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#F4F4F6}
a{color:#6A22B0}a:hover{color:#4C1782}
.ned-scroll::-webkit-scrollbar{display:none}
.ned-scroll{scrollbar-width:none;-ms-overflow-style:none}
input::placeholder{color:#8A8A96}
@keyframes nedspin{to{transform:rotate(360deg)}}
@keyframes nedbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
/* N.E.D surfaces & motion v1 (see Motion & Surfaces board) */
:root{--ned-ease:cubic-bezier(.2,0,0,1);--ned-ease-out:cubic-bezier(.16,1,.3,1)}
@keyframes ned-fade{from{opacity:0}to{opacity:1}}
@keyframes ned-rise{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}
@keyframes ned-pop{from{opacity:0;transform:translate3d(0,-6px,0) scale(.97)}to{opacity:1;transform:none}}
@keyframes ned-sheet{from{transform:translate3d(0,100%,0)}to{transform:none}}
.ned-screen{animation:ned-fade 200ms var(--ned-ease) both}
.ned-screen .ned-scroll>*,.ned-stagger>*{animation:ned-rise 360ms var(--ned-ease-out) both}
.ned-scroll>*:nth-child(2),.ned-stagger>*:nth-child(2){animation-delay:40ms}
.ned-scroll>*:nth-child(3),.ned-stagger>*:nth-child(3){animation-delay:80ms}
.ned-scroll>*:nth-child(4),.ned-stagger>*:nth-child(4){animation-delay:120ms}
.ned-scroll>*:nth-child(5),.ned-stagger>*:nth-child(5){animation-delay:160ms}
.ned-scroll>*:nth-child(n+6),.ned-stagger>*:nth-child(n+6){animation-delay:200ms}
.ned-swap{animation:ned-rise 320ms var(--ned-ease-out) both}
.ned-pop{animation:ned-pop 200ms var(--ned-ease-out) both;transform-origin:top right}
.ned-sheet{animation:ned-sheet 360ms var(--ned-ease-out) both}
.ned-backdrop{animation:ned-fade 220ms var(--ned-ease) both}
a,button,label{-webkit-tap-highlight-color:transparent;transition:transform 160ms var(--ned-ease),background-color 200ms var(--ned-ease),color 200ms var(--ned-ease),box-shadow 200ms var(--ned-ease),opacity 200ms var(--ned-ease)}
a:active,button:active{transform:scale(.98)}
input,select,textarea{transition:box-shadow 180ms var(--ned-ease),background-color 180ms var(--ned-ease)}
input:focus,select:focus,textarea:focus{outline:none;background-color:#FFFFFF!important;box-shadow:0 0 0 3px rgba(123,47,190,.18)!important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="ned-screen" style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F4F6; color: #111116; display: flex; flex-direction: column; overflow: hidden; position: relative; font-family: 'Inter', system-ui, sans-serif">
  <div style="padding: 12px 24px 8px; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2">
    <div style="font-size: 14px; font-weight: 600; color: #111116">9:41</div>
    <div style="display: flex; gap: 6px; align-items: center">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" aria-hidden="true"><rect x="0" y="4" width="3" height="8" rx="1" fill="#111116"></rect><rect x="4" y="2" width="3" height="10" rx="1" fill="#111116"></rect><rect x="8" y="0" width="3" height="12" rx="1" fill="#111116"></rect><rect x="12" y="2" width="3" height="10" rx="1" fill="#C9C9D2"></rect></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none" aria-hidden="true"><rect x="0.5" y="0.5" width="21" height="11" rx="2" stroke="#8A8A96"></rect><rect x="2" y="2" width="15" height="8" rx="1" fill="#111116"></rect><rect x="22.5" y="3.5" width="2" height="5" rx="1" fill="#8A8A96"></rect></svg>
    </div>
  </div>
  <div style="padding: 0 16px; display: flex; justify-content: flex-end; position: relative"><span style="display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 9999px; background: #FFF5E1; font-size: 11px; font-weight: 600; color: #8A5300; white-space: nowrap"><span style="width: 6px; height: 6px; border-radius: 9999px; background: #F59E0B"></span>Devnet · test money</span></div>
  <div class="ned-scroll" style="flex: 1; overflow-y: auto; padding: 10px 24px 0; display: flex; flex-direction: column; align-items: center; text-align: center; position: relative">
    <sc-if value="{{showTeddy}}" hint-placeholder-val="{{ true }}">
      <img src="/_blob/22f5490f03888bc46a04dbf909a17ab4" alt="" style="width: 150px; height: 116px; object-fit: contain">
    </sc-if>
    <sc-if value="{{noTeddy}}" hint-placeholder-val="{{ false }}">
      <div style="width: 80px; height: 80px; border-radius: 9999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; border: none; box-shadow: 0 1px 2px rgba(17,17,22,0.04), 0 6px 16px -6px rgba(17,17,22,0.10)"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#4B4B57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"></path><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"></path></svg></div>
    </sc-if>
    <div style="margin-top: 14px"><span style="{{chipStyle}}"><span style="{{dotStyle}}"></span>{{chipText}}</span></div>
    <h1 style="margin: 12px 0 0; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; line-height: 1.2">{{headline}}</h1>
    <sc-if value="{{simLine}}" hint-placeholder-val="{{ false }}">
      <div style="margin-top: 10px; display: flex; align-items: center; gap: 6px; justify-content: center; flex-wrap: wrap; font-size: 13px; color: #3F3F49">VND payout simulated in this demo <span style="display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 6px; background: #EEEEF2; font-size: 10px; font-weight: 700; letter-spacing: 0.4px; color: #3F3F49; white-space: nowrap">SIMULATED</span></div>
    </sc-if>
    <p style="margin: 8px 0 0; font-size: 14px; line-height: 1.5; color: #3F3F49">{{sub}}</p>
    <div role="group" aria-label="Receipt" style="margin-top: 18px; width: 100%; padding: 4px 14px; box-sizing: border-box; text-align: left; border-radius: 20px; background: #FFFFFF">
      <sc-for list="{{receipt}}" as="r" hint-placeholder-count="4">
        <div style="display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-top: {{r.sep}}"><span style="font-size: 13px; color: #5E5E6A">{{r.k}}</span><span style="font-size: 13px; font-weight: 600; text-align: right">{{r.v}}</span></div>
      </sc-for>
      <a href="https://explorer.solana.com/tx/5h3KpQ9vXy2mWc7RtLd8NfB4sJ6aZe1Gu3HkTr9qPw2YxV8nCm4LbD7sF2gK9jQ1?cluster=devnet" target="_blank" rel="noopener" style="display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-top: 1px solid #F0F0F3; font-size: 13px; font-weight: 600; text-decoration: none">View on Explorer <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg></a>
    </div>
    <div style="margin-top: 10px; font-size: 11px; color: #5E5E6A">N.E.D fee: none during the pilot · Network fee ~0.000005 SOL (devnet test SOL)</div>
    <sc-if value="{{hasDemo}}" hint-placeholder-val="{{ false }}">
      <div style="margin-top: 14px"><a href="{{demoHref}}" style="display: inline-flex; align-items: center; height: 34px; padding: 0 12px; border-radius: 9999px; font-size: 12px; font-weight: 600; color: #3F3F49; text-decoration: none; border: none; background: #EBEBF0">DEMO · {{demoText}} →</a></div>
    </sc-if>
  </div>
  <div style="padding: 12px 24px 28px; display: flex; flex-direction: column; gap: 10px">
    <a href="{{doneHref}}" style="height: 52px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 9999px; background: #7B2FBE; font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 600; color: #FFFFFF; text-decoration: none; border: none; cursor: pointer; width: 100%">Done</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"who": {"editor": "enum", "options": ["client", "freelancer", "anyone", "refund", "split"], "default": "client"}, "view": {"editor": "enum", "options": ["vn", "intl"], "default": "intl"}, "contract": {"editor": "enum", "options": ["A", "B"], "default": "A"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    var TONE = { info: ['#EEEFFE', '#EEEFFE', '#3730A3', '#4F46E5'], purple: ['#F2EAFB', '#F2EAFB', '#6A22B0', '#7B2FBE'], warning: ['#FFF5E1', '#FFF5E1', '#8A5300', '#F59E0B'], success: ['#E7F6EC', '#E7F6EC', '#127A3A', '#16A34A'], neutral: ['#EFEFF3', '#EFEFF3', '#4B4B57', '#8A8A96'], error: ['#FDECEC', '#FDECEC', '#B42318', '#DC2626'] };
    function chip(t) { var c = TONE[t] || TONE.neutral; return 'display: inline-flex; align-items: center; gap: 6px; min-height: 24px; padding: 3px 10px; box-sizing: border-box; border-radius: 9999px; font-size: 12px; font-weight: 600; line-height: 1.3; background: ' + c[0] + '; color: ' + c[2]; }
    function dot(t) { var c = TONE[t] || TONE.neutral; return 'width: 6px; height: 6px; border-radius: 9999px; flex-shrink: 0; background: ' + c[3]; }
    var RATE = 26019.5;
    function grp(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
    function vnd(usd) { return '≈ ' + grp(Math.round(usd * RATE / 10000) * 10000) + ' VND'; }
    function usdc(n) { return n.toFixed(2) + ' USDC'; }
    function usd(n) { return '$' + n.toFixed(2); }

    var who = this.props.who ?? 'client';
    var vn = (this.props.view ?? 'intl') === 'vn';
    var B = (this.props.contract ?? 'A') === 'B';
    var title = B ? 'Logo refresh' : 'Landing page design · Milestone 1';
    var fl = 'vinh', flName = 'Vinh';
    var dest = 'VND via payout partner (simulated)';
    var h, sub, chipT = ['Released', 'success'], teddy = true, rec, demo = null, doneHref = 'HomeIntl.dc.html', sim = false;
    if (who === 'client') { h = 'Released to ' + flName; sub = title + ' · 10.00 USDC'; rec = [['Contract', title], ['Amount', '10.00 USDC'], ['To', dest], ['Released by', 'You (@mia)']]; if (!B) demo = ['MilestoneReleasedVN.dc.html', "switch to @vinh's phone"]; }
    else if (who === 'freelancer' && vn) { h = 'Released to payout partner'; sim = true; sub = vnd(10) + ' (estimate) · $10.00 · rate of 2 Oct 2026. The partner sends VND to your bank; this demo stops here.'; rec = [['Contract', title], ['Amount', vnd(10) + ' (estimate)'], ['To', 'Payout partner (simulated)'], ['From', '@mia']]; doneHref = 'HomeVN.dc.html'; }
    else if (who === 'freelancer' || who === 'anyone') { h = '10.00 USDC released to @' + fl; sub = title + ' · to ' + dest; rec = [['Contract', title], ['Amount', '10.00 USDC'], ['To', dest], ['Released by', who === 'anyone' ? 'You (anyone can, after the review time)' : '@mia']]; }
    else if (who === 'refund') { h = '10.00 USDC refunded to @mia'; teddy = false; chipT = ['Refunded to client', 'neutral']; sub = title + ' · the submission deadline passed, or the freelancer conceded.'; rec = [['Contract', title], ['Amount', '10.00 USDC'], ['To', '@mia (client)'], ['Reason', 'Deadline passed or conceded']]; }
    else { h = 'Split released'; sub = title + ' · both sides agreed the exact amounts.'; rec = [['To @vinh', '6.00 USDC'], ['To @mia', '4.00 USDC'], ['Contract', title], ['Status', 'Ended by agreement']]; chipT = ['Ended by agreement', 'neutral']; }
    return {
      showTeddy: teddy, noTeddy: !teddy, headline: h, sub: sub, simLine: sim,
      chipText: chipT[0], chipStyle: chip(chipT[1]), dotStyle: dot(chipT[1]),
      receipt: rec.map(function (r, i) { return { k: r[0], v: r[1], sep: i ? '1px solid #E6E6EB' : 'none' }; }),
      hasDemo: !!demo, demoHref: demo ? demo[0] : '', demoText: demo ? demo[1] : '', doneHref: doneHref
    };
  }
}
</script>
</body>
</html>
