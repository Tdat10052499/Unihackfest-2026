<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NED — Contracts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#F4F4F6}
a{color:#6A22B0}a:hover{color:#4C1782}
.ned-scroll::-webkit-scrollbar{display:none}
.ned-scroll{scrollbar-width:none;-ms-overflow-style:none}
input::placeholder{color:#8A8A96}
@keyframes nedspin{to{transform:rotate(360deg)}}
@keyframes nedbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
/* N.E.D surfaces & motion v1 (see Motion & Surfaces board) */
:root{--ned-ease:cubic-bezier(.2,0,0,1);--ned-ease-out:cubic-bezier(.16,1,.3,1)}
@keyframes ned-fade{from{opacity:0}to{opacity:1}}
@keyframes ned-rise{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}
@keyframes ned-pop{from{opacity:0;transform:translate3d(0,-6px,0) scale(.97)}to{opacity:1;transform:none}}
@keyframes ned-sheet{from{transform:translate3d(0,100%,0)}to{transform:none}}
.ned-screen{animation:ned-fade 200ms var(--ned-ease) both}
.ned-screen .ned-scroll>*,.ned-stagger>*{animation:ned-rise 360ms var(--ned-ease-out) both}
.ned-scroll>*:nth-child(2),.ned-stagger>*:nth-child(2){animation-delay:40ms}
.ned-scroll>*:nth-child(3),.ned-stagger>*:nth-child(3){animation-delay:80ms}
.ned-scroll>*:nth-child(4),.ned-stagger>*:nth-child(4){animation-delay:120ms}
.ned-scroll>*:nth-child(5),.ned-stagger>*:nth-child(5){animation-delay:160ms}
.ned-scroll>*:nth-child(n+6),.ned-stagger>*:nth-child(n+6){animation-delay:200ms}
.ned-swap{animation:ned-rise 320ms var(--ned-ease-out) both}
.ned-pop{animation:ned-pop 200ms var(--ned-ease-out) both;transform-origin:top right}
.ned-sheet{animation:ned-sheet 360ms var(--ned-ease-out) both}
.ned-backdrop{animation:ned-fade 220ms var(--ned-ease) both}
a,button,label{-webkit-tap-highlight-color:transparent;transition:transform 160ms var(--ned-ease),background-color 200ms var(--ned-ease),color 200ms var(--ned-ease),box-shadow 200ms var(--ned-ease),opacity 200ms var(--ned-ease)}
a:active,button:active{transform:scale(.98)}
input,select,textarea{transition:box-shadow 180ms var(--ned-ease),background-color 180ms var(--ned-ease)}
input:focus,select:focus,textarea:focus{outline:none;background-color:#FFFFFF!important;box-shadow:0 0 0 3px rgba(123,47,190,.18)!important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="ned-screen" style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F4F6; color: #111116; display: flex; flex-direction: column; overflow: hidden; position: relative; font-family: 'Inter', system-ui, sans-serif">
  <div style="padding: 12px 24px 8px; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2">
    <div style="font-size: 14px; font-weight: 600; color: #111116">9:41</div>
    <div style="display: flex; gap: 6px; align-items: center">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" aria-hidden="true"><rect x="0" y="4" width="3" height="8" rx="1" fill="#111116"></rect><rect x="4" y="2" width="3" height="10" rx="1" fill="#111116"></rect><rect x="8" y="0" width="3" height="12" rx="1" fill="#111116"></rect><rect x="12" y="2" width="3" height="10" rx="1" fill="#C9C9D2"></rect></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none" aria-hidden="true"><rect x="0.5" y="0.5" width="21" height="11" rx="2" stroke="#8A8A96"></rect><rect x="2" y="2" width="15" height="8" rx="1" fill="#111116"></rect><rect x="22.5" y="3.5" width="2" height="5" rx="1" fill="#8A8A96"></rect></svg>
    </div>
  </div>

  <div style="padding: 4px 20px 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; position: relative; z-index: 3">
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.5px">Contracts</h1>
    <span style="display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 9999px; background: #FFF5E1; font-size: 11px; font-weight: 600; color: #8A5300; white-space: nowrap"><span style="width: 6px; height: 6px; border-radius: 9999px; background: #F59E0B"></span>Devnet · test money</span>
  </div>
  <div style="padding: 14px 16px 0">
    <div role="tablist" aria-label="Your role" style="display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 14px; background: #FFFFFF; border: none; box-shadow: 0 1px 2px rgba(17,17,22,0.04), 0 6px 16px -6px rgba(17,17,22,0.10)">
      <button role="tab" aria-selected="{{segF.on}}" onClick="{{segF.pick}}" style="{{segF.style}}">As freelancer</button>
      <button role="tab" aria-selected="{{segC.on}}" onClick="{{segC.pick}}" style="{{segC.style}}">As client</button>
    </div>
    <div role="group" aria-label="Filter" style="margin-top: 12px; display: flex; gap: 8px">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
        <button aria-pressed="{{f.on}}" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
      </sc-for>
    </div>
  </div>
  <div class="ned-scroll" style="flex: 1; overflow-y: auto; padding: 14px 16px 120px">
    <sc-if value="{{hasRows}}" hint-placeholder-val="{{ true }}">
      <div style="overflow: hidden; border-radius: 20px; background: #FFFFFF">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="2">
          <a href="{{r.href}}" style="display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; text-decoration: none; color: #111116">
            <dc-import name="Avatar" seed="{{r.seed}}" size="40" hint-size="40px,40px"></dc-import>
            <div style="flex: 1; min-width: 0">
              <div style="font-size: 15px; font-weight: 600; line-height: 1.35">{{r.title}}</div>
              <div style="margin-top: 2px; font-size: 13px; line-height: 1.4; color: #5E5E6A">{{r.party}} · {{r.deadline}}</div>
              <div style="margin-top: 8px; display: flex; align-items: flex-end; justify-content: space-between; gap: 8px">
                <span style="{{r.chip}}"><span style="{{r.dot}}"></span>{{r.status}}</span>
                <span style="text-align: right; flex-shrink: 0"><span style="display: block; font-size: 15px; font-weight: 700; white-space: nowrap">{{r.total}}</span><span style="display: block; margin-top: 1px; font-size: 11px; color: #5E5E6A; white-space: nowrap">{{r.totalSub}}</span></span>
              </div>
            </div>
          </a>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{noRows}}" hint-placeholder-val="{{ false }}">
      <div style="padding: 30px 16px 0; display: flex; flex-direction: column; align-items: center; text-align: center">
        <img src="/_blob/6b5178b3c2e1fe17910ea565b9a1f09f" alt="" style="width: 150px; height: 116px; object-fit: contain">
        <div style="margin-top: 14px; font-family: 'Space Grotesk', sans-serif; font-size: 19px; font-weight: 700">{{emptyTitle}}</div>
        <div style="margin-top: 6px; font-size: 14px; line-height: 1.5; color: #5E5E6A">{{emptyBody}}</div>
      </div>
    </sc-if>
  </div>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 96px; z-index: 6">
    <sc-if value="{{isClient}}" hint-placeholder-val="{{ false }}">
      <a href="ContractNew1Freelancer.dc.html" style="height: 52px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 9999px; background: #7B2FBE; font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 600; color: #FFFFFF; text-decoration: none; border: none; cursor: pointer; width: 100%;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111116" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New contract</a>
    </sc-if>
    <sc-if value="{{isFreelancer}}" hint-placeholder-val="{{ true }}">
      <button onClick="{{copyHandle}}" style="height: 52px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 9999px; background: #F2EAFB; border: none; font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 600; color: #6A22B0; text-decoration: none; cursor: pointer; width: 100%; background: #FFFFFF">{{shareLabel}}</button>
    </sc-if>
  </div>
  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 4px 8px 22px; display: flex; align-items: center; background: #FFFFFF; z-index: 8; box-shadow: 0 -10px 30px -12px rgba(17,17,22,0.10)">
    <a href="{{navHome}}" style="flex: 1; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5E5E6A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.2 12 3l9 7.2V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg><span style="font-size: 11px; font-weight: 500; color: #5E5E6A">Home</span></a>
    <div aria-current="page" style="flex: 1; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7B2FBE" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M9 8h6M9 12h6M9 16h3"></path></svg><span style="font-size: 11px; font-weight: 700; color: #7B2FBE">Contracts</span></div>
    <a href="{{navRecords}}" style="flex: 1; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5E5E6A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg><span style="font-size: 11px; font-weight: 500; color: #5E5E6A">Records</span></a>
    <a href="{{navSettings}}" style="flex: 1; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5E5E6A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg><span style="font-size: 11px; font-weight: 500; color: #5E5E6A">Settings</span></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"segment": {"editor": "enum", "options": ["freelancer", "client"], "default": "freelancer"}, "empty": {"editor": "boolean", "default": false}, "view": {"editor": "enum", "options": ["vn", "intl"], "default": "vn"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { seg: props.segment ?? 'freelancer', filter: 'active', copied: false }; }
  renderVals() {
    var self = this;
    var TONE = { info: ['#EEEFFE', '#EEEFFE', '#3730A3', '#4F46E5'], purple: ['#F2EAFB', '#F2EAFB', '#6A22B0', '#7B2FBE'], warning: ['#FFF5E1', '#FFF5E1', '#8A5300', '#F59E0B'], success: ['#E7F6EC', '#E7F6EC', '#127A3A', '#16A34A'], neutral: ['#EFEFF3', '#EFEFF3', '#4B4B57', '#8A8A96'], error: ['#FDECEC', '#FDECEC', '#B42318', '#DC2626'] };
    function chip(t) { var c = TONE[t] || TONE.neutral; return 'display: inline-flex; align-items: center; gap: 6px; min-height: 24px; padding: 3px 10px; box-sizing: border-box; border-radius: 9999px; font-size: 12px; font-weight: 600; line-height: 1.3; background: ' + c[0] + '; color: ' + c[2]; }
    function dot(t) { var c = TONE[t] || TONE.neutral; return 'width: 6px; height: 6px; border-radius: 9999px; flex-shrink: 0; background: ' + c[3]; }
    var RATE = 26019.5;
    function grp(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
    function vnd(usd) { return '≈ ' + grp(Math.round(usd * RATE / 10000) * 10000) + ' VND'; }
    function usdc(n) { return n.toFixed(2) + ' USDC'; }
    function usd(n) { return '$' + n.toFixed(2); }

    var vn = (this.props.view ?? 'vn') === 'vn';
    var empty = this.props.empty === true || this.props.empty === 'true';
    var seg = this.state.seg, filter = this.state.filter;
    function segBtn(k) {
      var on = seg === k;
      return { on: on ? 'true' : 'false', pick: function () { self.setState({ seg: k, filter: 'active' }); },
        style: 'height: 40px; border-radius: 10px; border: none; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 600; color: ' + (on ? '#111116' : '#5E5E6A') + '; background: ' + (on ? '#FFFFFF' : 'transparent') };
    }
    var all = seg === 'freelancer' ? [
      { t: 'Landing page design', p: 'from @mia', d: 'Milestone 1 due 12 Oct, 18:00', s: 'Locked · work in progress', tone: 'purple', amt: 20, href: vn ? 'ContractDetailVinhLocked.dc.html' : 'ContractDetail.dc.html', f: ['active', 'needs'] },
      { t: 'Logo refresh', p: 'from @mia', d: 'Review time passed', s: 'Submitted · review time passed', tone: 'warning', amt: 10, href: 'ContractDetailLogo.dc.html', f: ['active', 'needs'] }
    ] : [
      { t: 'Landing page design', p: 'to @vinh', d: 'Milestone 1 due 12 Oct, 18:00', s: 'Locked · work in progress', tone: 'purple', amt: 20, href: 'ContractDetailMiaLocked.dc.html', f: ['active'] },
      { t: 'Logo refresh', p: 'to @vinh', d: 'Review time passed', s: 'Submitted · review time passed', tone: 'warning', amt: 10, href: 'ContractDetailLogo.dc.html', f: ['active', 'needs'] }
    ];
    var showVnd = vn && seg === 'freelancer';
    var rows = empty ? [] : all.filter(function (r) { return r.f.indexOf(filter) >= 0; }).map(function (o, i) {
      var ini = o.p.replace(/^.*@/, '').charAt(0).toUpperCase();
      return { seed: o.p.replace(/^.*@/, ''), title: o.t, party: o.p, deadline: o.d, status: o.s, chip: chip(o.tone), dot: dot(o.tone), total: showVnd ? vnd(o.amt) : usdc(o.amt), totalSub: showVnd ? usd(o.amt) + ' · estimate' : 'total', href: o.href, initial: ini,
        av: 'width: 40px; height: 40px; border-radius: 9999px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; background: ' + ({ M: '#FBF0DC', V: '#E3EDFC', L: '#E3F5EE' }[ini] || '#EEEEF2') + '; color: ' + ({ M: '#8A5300', V: '#1D4ED8', L: '#127A3A' }[ini] || '#3F3F49') };
    });
    var F = [['active', 'Active'], ['needs', 'Needs action'], ['completed', 'Completed']];
    var filters = F.map(function (x) {
      var on = filter === x[0];
      return { label: x[1], on: on ? 'true' : 'false', pick: function () { self.setState({ filter: x[0] }); },
        style: 'height: 36px; padding: 0 14px; border-radius: 9999px; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 600; color: ' + (on ? '#FFFFFF' : '#3F3F49') + '; background: ' + (on ? '#7B2FBE' : '#FFFFFF') + '; border: none' };
    });
    var et, eb;
    if (empty || filter === 'active') { et = seg === 'freelancer' ? 'No contracts yet' : 'No contracts yet'; eb = seg === 'freelancer' ? 'Share your @username with a client. Their contract shows up here.' : 'Create a contract and lock USDC for each milestone.'; }
    else if (filter === 'needs') { et = 'Nothing needs you'; eb = 'Contracts that wait for you show up here.'; }
    else { et = 'No completed contracts yet'; eb = 'When every milestone is released or refunded, the contract moves here.'; }
    return {
      segF: segBtn('freelancer'), segC: segBtn('client'), filters: filters, rows: rows,
      hasRows: rows.length > 0, noRows: rows.length === 0, emptyTitle: et, emptyBody: eb,
      isClient: seg === 'client', isFreelancer: seg === 'freelancer',
      shareLabel: this.state.copied ? 'Link copied: ned.app/@vinh' : 'Share my @username',
      copyHandle: function () { try { navigator.clipboard && navigator.clipboard.writeText('ned.app/@vinh'); } catch (e) {} self.setState({ copied: true }); },
      navHome: vn ? 'HomeVN.dc.html' : 'HomeIntl.dc.html', navRecords: vn ? 'Records.dc.html' : 'RecordsIntl.dc.html', navSettings: vn ? 'Settings.dc.html' : 'SettingsIntl.dc.html'
    };
  }
}
</script>
</body>
</html>
