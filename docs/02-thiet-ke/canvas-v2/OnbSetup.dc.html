<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NED — Setting up</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#F4F4F6}
a{color:#6A22B0}a:hover{color:#6A22B0}
.ned-scroll::-webkit-scrollbar{display:none}
.ned-scroll{scrollbar-width:none;-ms-overflow-style:none}
input::placeholder{color:#8A8A96}
@keyframes nedspin{to{transform:rotate(360deg)}}
@keyframes nedbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
/* N.E.D surfaces & motion v1 (see Motion & Surfaces board) */
:root{--ned-ease:cubic-bezier(.2,0,0,1);--ned-ease-out:cubic-bezier(.16,1,.3,1)}
@keyframes ned-fade{from{opacity:0}to{opacity:1}}
@keyframes ned-rise{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}
@keyframes ned-pop{from{opacity:0;transform:translate3d(0,-6px,0) scale(.97)}to{opacity:1;transform:none}}
@keyframes ned-sheet{from{transform:translate3d(0,100%,0)}to{transform:none}}
.ned-screen{animation:ned-fade 200ms var(--ned-ease) both}
.ned-screen .ned-scroll>*,.ned-stagger>*{animation:ned-rise 360ms var(--ned-ease-out) both}
.ned-scroll>*:nth-child(2),.ned-stagger>*:nth-child(2){animation-delay:40ms}
.ned-scroll>*:nth-child(3),.ned-stagger>*:nth-child(3){animation-delay:80ms}
.ned-scroll>*:nth-child(4),.ned-stagger>*:nth-child(4){animation-delay:120ms}
.ned-scroll>*:nth-child(5),.ned-stagger>*:nth-child(5){animation-delay:160ms}
.ned-scroll>*:nth-child(n+6),.ned-stagger>*:nth-child(n+6){animation-delay:200ms}
.ned-swap{animation:ned-rise 320ms var(--ned-ease-out) both}
.ned-pop{animation:ned-pop 200ms var(--ned-ease-out) both;transform-origin:top right}
.ned-sheet{animation:ned-sheet 360ms var(--ned-ease-out) both}
.ned-backdrop{animation:ned-fade 220ms var(--ned-ease) both}
a,button,label{-webkit-tap-highlight-color:transparent;transition:transform 160ms var(--ned-ease),background-color 200ms var(--ned-ease),color 200ms var(--ned-ease),box-shadow 200ms var(--ned-ease),opacity 200ms var(--ned-ease)}
a:active,button:active{transform:scale(.98)}
input,select,textarea{transition:box-shadow 180ms var(--ned-ease),background-color 180ms var(--ned-ease)}
input:focus,select:focus,textarea:focus{outline:none;background-color:#FFFFFF!important;box-shadow:0 0 0 3px rgba(123,47,190,.18)!important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="ned-screen" style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F4F6; color: #111116; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="padding: 12px 24px 8px; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2">
    <div style="font-size: 14px; font-weight: 600; color: #111116">9:41</div>
    <div style="display: flex; gap: 6px; align-items: center">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="4" width="3" height="8" rx="1" fill="#111116"></rect><rect x="4" y="2" width="3" height="10" rx="1" fill="#111116"></rect><rect x="8" y="0" width="3" height="12" rx="1" fill="#111116"></rect><rect x="12" y="2" width="3" height="10" rx="1" fill="#D4D4DC"></rect></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2" stroke="#8A8A96"></rect><rect x="2" y="2" width="15" height="8" rx="1" fill="#22C55E"></rect><rect x="22.5" y="3.5" width="2" height="5" rx="1" fill="#8A8A96"></rect></svg>
    </div>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; padding: 70px 28px 0; position: relative; z-index: 1">
    <img src="/_blob/3385a7c81923ce262d24f4cda7f87bcd" alt="" style="width: 200px; height: 156px; object-fit: contain">
    <h1 style="margin: 26px 0 0; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; text-align: center">{{heading}}</h1>
    <p style="margin: 8px 0 0; font-size: 14px; line-height: 1.5; text-align: center; color: #5E5E6A">{{subheading}}</p>
    <div role="list" style="margin-top: 30px; width: 100%; display: flex; flex-direction: column; gap: 14px">
      <sc-for list="{{steps}}" as="st" hint-placeholder-count="3">
        <div role="listitem" style="display: flex; align-items: center; gap: 12px">
          <sc-if value="{{st.done}}" hint-placeholder-val="{{ true }}">
            <div style="width: 24px; height: 24px; border-radius: 9999px; background: #E7F6EC; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: none">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
            </div>
          </sc-if>
          <sc-if value="{{st.active}}" hint-placeholder-val="{{ false }}">
            <div style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 9999px; border: 2px solid #E6E6EB; border-top-color: #6A22B0; animation: nedspin 0.9s linear infinite; flex-shrink: 0"></div>
          </sc-if>
          <sc-if value="{{st.waiting}}" hint-placeholder-val="{{ false }}">
            <div style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 9999px; border: 2px solid #E6E6EB; flex-shrink: 0"></div>
          </sc-if>
          <div style="{{st.style}}">{{st.label}}</div>
        </div>
      </sc-for>
    </div>
    <div style="flex: 1"></div>
    <div style="width: 100%; padding-bottom: 28px">
      <sc-if value="{{doneNew}}" hint-placeholder-val="{{ false }}">
        <a href="OnbConsent.dc.html" style="height: 52px; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 9999px; background: #7B2FBE; font-size: 16px; font-weight: 600; color: #FFFFFF; text-decoration: none">Continue</a>
      </sc-if>
      <sc-if value="{{doneBack}}" hint-placeholder-val="{{ false }}">
        <a href="HomeVN.dc.html" style="height: 52px; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 9999px; background: #7B2FBE; font-size: 16px; font-weight: 600; color: #FFFFFF; text-decoration: none">Go to my contracts</a>
      </sc-if>
      <sc-if value="{{working}}" hint-placeholder-val="{{ true }}">
        <div style="height: 56px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; color: #5E5E6A">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5E5E6A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
          Secured with MPC. No recovery phrase to write down.
        </div>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"returning":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { step: 0 }; }
  componentDidMount() {
    var self = this;
    this.timer = setInterval(function () {
      if (self.state.step >= 3) { clearInterval(self.timer); return; }
      self.setState({ step: self.state.step + 1 });
    }, 1100);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    var back = this.props.returning ?? false;
    var step = this.state.step;
    var labels = ['Signed in with Google', 'Securing your wallet', back ? 'Found your N.E.D profile' : 'Checking for a N.E.D profile'];
    var steps = labels.map(function (l, i) {
      var done = i < step, active = i === step;
      return { label: l, done: done, active: active, waiting: !done && !active,
        style: 'font-size: 15px; font-weight: ' + (active ? '600' : '500') + '; color: ' + (done || active ? '#111116' : '#5E5E6A') };
    });
    var finished = step >= 3;
    return {
      steps: steps,
      heading: finished ? (back ? 'Welcome back, tdat!' : 'Your account is ready') : 'Setting up your wallet…',
      subheading: finished ? (back ? 'Everything is just as you left it.' : 'Two quick steps: your consent, then your profile.') : 'This takes a few seconds.',
      working: !finished, doneNew: finished && !back, doneBack: finished && back
    };
  }
}
</script>
</body>
</html>
