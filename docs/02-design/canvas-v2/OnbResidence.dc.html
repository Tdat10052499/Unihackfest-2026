<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NED — Where do you live?</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#F4F4F6}
a{color:#6A22B0}a:hover{color:#4C1782}
.ned-scroll::-webkit-scrollbar{display:none}
.ned-scroll{scrollbar-width:none;-ms-overflow-style:none}
input::placeholder{color:#8A8A96}
@keyframes nedspin{to{transform:rotate(360deg)}}
@keyframes nedbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
/* N.E.D surfaces & motion v1 (see Motion & Surfaces board) */
:root{--ned-ease:cubic-bezier(.2,0,0,1);--ned-ease-out:cubic-bezier(.16,1,.3,1)}
@keyframes ned-fade{from{opacity:0}to{opacity:1}}
@keyframes ned-rise{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}
@keyframes ned-pop{from{opacity:0;transform:translate3d(0,-6px,0) scale(.97)}to{opacity:1;transform:none}}
@keyframes ned-sheet{from{transform:translate3d(0,100%,0)}to{transform:none}}
.ned-screen{animation:ned-fade 200ms var(--ned-ease) both}
.ned-screen .ned-scroll>*,.ned-stagger>*{animation:ned-rise 360ms var(--ned-ease-out) both}
.ned-scroll>*:nth-child(2),.ned-stagger>*:nth-child(2){animation-delay:40ms}
.ned-scroll>*:nth-child(3),.ned-stagger>*:nth-child(3){animation-delay:80ms}
.ned-scroll>*:nth-child(4),.ned-stagger>*:nth-child(4){animation-delay:120ms}
.ned-scroll>*:nth-child(5),.ned-stagger>*:nth-child(5){animation-delay:160ms}
.ned-scroll>*:nth-child(n+6),.ned-stagger>*:nth-child(n+6){animation-delay:200ms}
.ned-swap{animation:ned-rise 320ms var(--ned-ease-out) both}
.ned-pop{animation:ned-pop 200ms var(--ned-ease-out) both;transform-origin:top right}
.ned-sheet{animation:ned-sheet 360ms var(--ned-ease-out) both}
.ned-backdrop{animation:ned-fade 220ms var(--ned-ease) both}
a,button,label{-webkit-tap-highlight-color:transparent;transition:transform 160ms var(--ned-ease),background-color 200ms var(--ned-ease),color 200ms var(--ned-ease),box-shadow 200ms var(--ned-ease),opacity 200ms var(--ned-ease)}
a:active,button:active{transform:scale(.98)}
input,select,textarea{transition:box-shadow 180ms var(--ned-ease),background-color 180ms var(--ned-ease)}
input:focus,select:focus,textarea:focus{outline:none;background-color:#FFFFFF!important;box-shadow:0 0 0 3px rgba(123,47,190,.18)!important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="ned-screen" style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F4F6; color: #111116; display: flex; flex-direction: column; overflow: hidden; position: relative; font-family: 'Inter', system-ui, sans-serif">
  <div style="padding: 12px 24px 8px; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2">
    <div style="font-size: 14px; font-weight: 600; color: #111116">9:41</div>
    <div style="display: flex; gap: 6px; align-items: center">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" aria-hidden="true"><rect x="0" y="4" width="3" height="8" rx="1" fill="#111116"></rect><rect x="4" y="2" width="3" height="10" rx="1" fill="#111116"></rect><rect x="8" y="0" width="3" height="12" rx="1" fill="#111116"></rect><rect x="12" y="2" width="3" height="10" rx="1" fill="#C9C9D2"></rect></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none" aria-hidden="true"><rect x="0.5" y="0.5" width="21" height="11" rx="2" stroke="#8A8A96"></rect><rect x="2" y="2" width="15" height="8" rx="1" fill="#111116"></rect><rect x="22.5" y="3.5" width="2" height="5" rx="1" fill="#8A8A96"></rect></svg>
    </div>
  </div>
  <div style="padding: 4px 20px 0; display: flex; align-items: center; gap: 14px; position: relative; z-index: 2">
    <a href="OnbProfile.dc.html" aria-label="Back" style="width: 44px; height: 44px; background: #FFFFFF; border-radius: 12px; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0; border: none; box-shadow: 0 1px 2px rgba(17,17,22,0.04), 0 6px 16px -6px rgba(17,17,22,0.10)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111116" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
    <div role="progressbar" aria-valuemin="1" aria-valuemax="3" aria-valuenow="3" aria-label="Step 3 of 3" style="flex: 1; display: flex; gap: 6px"><div style="flex: 1; height: 4px; border-radius: 9999px; background: #7B2FBE"></div><div style="flex: 1; height: 4px; border-radius: 9999px; background: #7B2FBE"></div><div style="flex: 1; height: 4px; border-radius: 9999px; background: #7B2FBE"></div></div>
  </div>

  <div class="ned-scroll" style="flex: 1; overflow-y: auto; padding: 22px 24px 0; position: relative; z-index: 1">
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.6px">Where do you live?</h1>
    <p style="margin: 8px 0 0; font-size: 14px; line-height: 1.5; color: #5E5E6A">This decides how amounts are shown and where your earnings can go.</p>
    <div role="radiogroup" aria-label="Where you live" style="margin-top: 22px; display: flex; flex-direction: column; gap: 12px">
      <button onClick="{{vn.pick}}" role="radio" aria-checked="{{vn.on}}" style="{{vn.style}}">
        <div style="display: flex; align-items: center; gap: 12px">
          <div style="width: 42px; height: 42px; border-radius: 12px; background: #EEEEF2; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 700">VN</div>
          <div style="flex: 1; font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700">I live in Vietnam</div>
          <div style="{{vn.radio}}"><div style="{{vn.radioDot}}"></div></div>
        </div>
        <div style="margin-top: 10px; font-size: 13px; line-height: 1.5; color: #3F3F49; text-align: left">You'll see amounts in VND and receive earnings in your bank account through a payout partner. No crypto balance is shown.</div>
      </button>
      <button onClick="{{intl.pick}}" role="radio" aria-checked="{{intl.on}}" style="{{intl.style}}">
        <div style="display: flex; align-items: center; gap: 12px">
          <div style="width: 42px; height: 42px; border-radius: 12px; background: #EEEEF2; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 700"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111116" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg></div>
          <div style="flex: 1; font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700">I live outside Vietnam</div>
          <div style="{{intl.radio}}"><div style="{{intl.radioDot}}"></div></div>
        </div>
        <div style="margin-top: 10px; font-size: 13px; line-height: 1.5; color: #3F3F49; text-align: left">You'll see USDC and receive earnings in your N.E.D wallet.</div>
      </button>

    </div>
    <div style="margin-top: 16px; display: flex; gap: 8px; align-items: center; font-size: 13px; color: #5E5E6A">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5E5E6A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8v.5"></path></svg>
      You can change this in Settings.
    </div>
  </div>
  <div style="padding: 12px 24px 28px; position: relative; z-index: 1">
    <a href="{{next}}" style="height: 52px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 9999px; background: #7B2FBE; font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 600; color: #FFFFFF; text-decoration: none; border: none; cursor: pointer; width: 100%">Continue</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"selected": {"editor": "enum", "options": ["vn", "intl"], "default": "vn"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: props.selected ?? 'vn' }; }
  renderVals() {
    var self = this, sel = this.state.sel;
    function o(k) {
      var on = sel === k;
      return {
        on: on ? 'true' : 'false',
        pick: function () { self.setState({ sel: k }); },
        style: 'display: block; width: 100%; padding: 16px; box-sizing: border-box; border-radius: 20px; cursor: pointer; color: #111116; font-family: inherit; text-align: left; background: ' + (on ? '#F2EAFB' : '#FFFFFF') + '; border: none; box-shadow: ' + (on ? 'none' : '0 1px 2px rgba(17,17,22,0.04), 0 6px 16px -6px rgba(17,17,22,0.10)'),
        radio: 'width: 22px; height: 22px; box-sizing: border-box; border-radius: 9999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 2px solid ' + (on ? '#6A22B0' : '#8A8A96'),
        radioDot: 'width: 10px; height: 10px; border-radius: 9999px; background: ' + (on ? '#6A22B0' : 'transparent')
      };
    }
    return { vn: o('vn'), intl: o('intl'), next: sel === 'vn' ? 'HomeVN.dc.html' : 'HomeIntl.dc.html' };
  }
}
</script>
</body>
</html>
