<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NED — Receive</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#F4F4F6}
a{color:#6A22B0}a:hover{color:#6A22B0}
.ned-scroll::-webkit-scrollbar{display:none}
.ned-scroll{scrollbar-width:none;-ms-overflow-style:none}
input::placeholder{color:#8A8A96}
@keyframes nedspin{to{transform:rotate(360deg)}}
@keyframes nedbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
/* N.E.D surfaces & motion v1 (see Motion & Surfaces board) */
:root{--ned-ease:cubic-bezier(.2,0,0,1);--ned-ease-out:cubic-bezier(.16,1,.3,1)}
@keyframes ned-fade{from{opacity:0}to{opacity:1}}
@keyframes ned-rise{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}
@keyframes ned-pop{from{opacity:0;transform:translate3d(0,-6px,0) scale(.97)}to{opacity:1;transform:none}}
@keyframes ned-sheet{from{transform:translate3d(0,100%,0)}to{transform:none}}
.ned-screen{animation:ned-fade 200ms var(--ned-ease) both}
.ned-screen .ned-scroll>*,.ned-stagger>*{animation:ned-rise 360ms var(--ned-ease-out) both}
.ned-scroll>*:nth-child(2),.ned-stagger>*:nth-child(2){animation-delay:40ms}
.ned-scroll>*:nth-child(3),.ned-stagger>*:nth-child(3){animation-delay:80ms}
.ned-scroll>*:nth-child(4),.ned-stagger>*:nth-child(4){animation-delay:120ms}
.ned-scroll>*:nth-child(5),.ned-stagger>*:nth-child(5){animation-delay:160ms}
.ned-scroll>*:nth-child(n+6),.ned-stagger>*:nth-child(n+6){animation-delay:200ms}
.ned-swap{animation:ned-rise 320ms var(--ned-ease-out) both}
.ned-pop{animation:ned-pop 200ms var(--ned-ease-out) both;transform-origin:top right}
.ned-sheet{animation:ned-sheet 360ms var(--ned-ease-out) both}
.ned-backdrop{animation:ned-fade 220ms var(--ned-ease) both}
a,button,label{-webkit-tap-highlight-color:transparent;transition:transform 160ms var(--ned-ease),background-color 200ms var(--ned-ease),color 200ms var(--ned-ease),box-shadow 200ms var(--ned-ease),opacity 200ms var(--ned-ease)}
a:active,button:active{transform:scale(.98)}
input,select,textarea{transition:box-shadow 180ms var(--ned-ease),background-color 180ms var(--ned-ease)}
input:focus,select:focus,textarea:focus{outline:none;background-color:#FFFFFF!important;box-shadow:0 0 0 3px rgba(123,47,190,.18)!important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="ned-screen" style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F4F6; color: #111116; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="padding: 12px 24px 8px; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2">
    <div style="font-size: 14px; font-weight: 600; color: #111116">9:41</div>
    <div style="display: flex; gap: 6px; align-items: center">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="4" width="3" height="8" rx="1" fill="#111116"></rect><rect x="4" y="2" width="3" height="10" rx="1" fill="#111116"></rect><rect x="8" y="0" width="3" height="12" rx="1" fill="#111116"></rect><rect x="12" y="2" width="3" height="10" rx="1" fill="#D4D4DC"></rect></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2" stroke="#8A8A96"></rect><rect x="2" y="2" width="15" height="8" rx="1" fill="#22C55E"></rect><rect x="22.5" y="3.5" width="2" height="5" rx="1" fill="#8A8A96"></rect></svg>
    </div>
  </div>

  <div style="padding: 4px 20px 0; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 2">
    <a href="HomeIntl.dc.html" aria-label="Back to Home" style="width: 44px; height: 44px; background: #FFFFFF; border-radius: 12px; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0; border: none; box-shadow: 0 1px 2px rgba(17,17,22,0.04), 0 6px 16px -6px rgba(17,17,22,0.10)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E5E6A" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700">Receive</h1>
    <div style="width: 44px; height: 44px"></div>
  </div>
  <div class="ned-scroll" style="flex: 1; overflow-y: auto; padding: 16px 24px 0; position: relative; z-index: 1">
    <p style="margin: 0; font-size: 14px; line-height: 1.5; text-align: center; color: #5E5E6A">People on N.E.D can send you USDC with your @username. Anyone else can scan this code.</p>

    <!-- QR card -->
    <div style="margin: 18px auto 0; width: 244px; padding: 18px; box-sizing: border-box; border-radius: 26px; background: #111116; position: relative">
      <svg width="208" height="208" viewBox="0 0 29 29" role="img" aria-label="QR code for your N.E.D wallet" shape-rendering="crispEdges">
        <path d="{{qr}}" fill="#FFFFFF"></path>
      </svg>
      <div style="position: absolute; top: 50%; left: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 14px; background: #7B2FBE; border: 4px solid #111116; box-sizing: border-box; display: flex; align-items: flex-end; justify-content: center; overflow: hidden">
        <img src="/_blob/3606719d081640f73145640e612b071e" alt="" style="width: 44px; height: 45px; margin-bottom: -5px">
      </div>
    </div>
    <div style="margin-top: 16px; text-align: center">
      <div style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700">@tdat</div>
      <div style="margin-top: 4px; font-size: 13px; color: #5E5E6A">N.E.D wallet · Solana</div>
    </div>

    <!-- Details -->
    <div style="margin-top: 18px; padding: 2px 16px; border-radius: 18px; background: #FFFFFF; border: none; box-shadow: 0 1px 2px rgba(17,17,22,0.04), 0 6px 16px -6px rgba(17,17,22,0.10)">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
        <div style="{{r.rowStyle}}">
          <div style="min-width: 0">
            <div style="font-size: 12px; color: #5E5E6A">{{r.label}}</div>
            <div style="margin-top: 2px; font-family: 'Space Mono', monospace; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.value}}</div>
          </div>
          <button onClick="{{r.copy}}" aria-label="{{r.copyLabel}}" style="width: 44px; height: 44px; margin-right: -10px; flex-shrink: 0; background: transparent; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center">
            <sc-if value="{{r.copied}}" hint-placeholder-val="{{ false }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
            <sc-if value="{{r.notCopied}}" hint-placeholder-val="{{ true }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#3F3F49" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg></sc-if>
          </button>
        </div>
      </sc-for>
    </div>

    <div style="margin-top: 12px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; background: #FFF5E1; border-radius: 14px; border: none">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B45309" stroke-width="2" stroke-linecap="round" style="flex-shrink: 0; margin-top: 1px" aria-hidden="true"><path d="M12 3 2 20h20L12 3z"></path><path d="M12 10v4M12 17v.5"></path></svg>
      <div style="font-size: 12px; line-height: 1.5; color: #3F3F49">Only receive <strong>USDC, SOL or Solana tokens</strong>. Funds sent from another network can't be recovered.</div>
    </div>
    <div style="height: 16px"></div>
  </div>
  <div style="padding: 12px 24px 28px; position: relative; z-index: 1">
    <button onClick="{{share}}" style="width: 100%; border: none; cursor: pointer; height: 52px; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 9999px; background: #7B2FBE; font-size: 16px; font-weight: 600; color: #FFFFFF; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111116" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"></path><path d="M16 6l-4-4-4 4M12 2v13"></path></svg>
      {{shareLabel}}
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { copied: '', shared: false }; }
  renderVals() {
    var self = this;
    // Decorative QR-style pattern (fixed seed); the real app renders the wallet address as a QR
    var N = 29, d = '', seed = 7;
    function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    function finder(x, y) { return x < 7 && y < 7 || x >= N - 7 && y < 7 || x < 7 && y >= N - 7; }
    function finderOn(x, y) {
      var fx = x >= N - 7 ? x - (N - 7) : x, fy = y >= N - 7 ? y - (N - 7) : y;
      return fx === 0 || fx === 6 || fy === 0 || fy === 6 || (fx >= 2 && fx <= 4 && fy >= 2 && fy <= 4);
    }
    for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) {
      var on = finder(x, y) ? finderOn(x, y) : (x > 10 && x < 18 && y > 10 && y < 18 ? false : rnd() > 0.52);
      if (on) d += 'M' + x + ' ' + y + 'h1v1h-1z';
    }
    var data = [
      { key: 'user', label: 'Username', value: '@tdat' },
      { key: 'phone', label: 'Phone number', value: '+84 90 •••• 4567' },
      { key: 'addr', label: 'Wallet address', value: '7xK9mQ…Vr3fQa', full: '7xK9mQ2vR8LpT4wZ1nC6yH3bJ5dFsEaGu9kVr3fQa' }
    ];
    var rows = data.map(function (r, i) {
      var c = self.state.copied === r.key;
      return {
        label: r.label, value: r.value, copied: c, notCopied: !c,
        copyLabel: c ? r.label + ' copied' : 'Copy ' + r.label.toLowerCase(),
        copy: function () { try { if (navigator.clipboard) navigator.clipboard.writeText(r.full || r.value); } catch (e) {} self.setState({ copied: r.key }); },
        rowStyle: 'display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0;' + (i < data.length - 1 ? ' border-bottom: 1px solid #F0F0F3' : '')
      };
    });
    return {
      qr: d, rows: rows,
      share: function () { self.setState({ shared: true }); },
      shareLabel: this.state.shared ? 'Link copied' : 'Share my details'
    };
  }
}
</script>
</body>
</html>
