<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NED — Send, choose recipient</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#F4F4F6}
a{color:#6A22B0}a:hover{color:#6A22B0}
.ned-scroll::-webkit-scrollbar{display:none}
.ned-scroll{scrollbar-width:none;-ms-overflow-style:none}
input::placeholder{color:#8A8A96}
@keyframes nedspin{to{transform:rotate(360deg)}}
@keyframes nedbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
/* N.E.D surfaces & motion v1 (see Motion & Surfaces board) */
:root{--ned-ease:cubic-bezier(.2,0,0,1);--ned-ease-out:cubic-bezier(.16,1,.3,1)}
@keyframes ned-fade{from{opacity:0}to{opacity:1}}
@keyframes ned-rise{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}
@keyframes ned-pop{from{opacity:0;transform:translate3d(0,-6px,0) scale(.97)}to{opacity:1;transform:none}}
@keyframes ned-sheet{from{transform:translate3d(0,100%,0)}to{transform:none}}
.ned-screen{animation:ned-fade 200ms var(--ned-ease) both}
.ned-screen .ned-scroll>*,.ned-stagger>*{animation:ned-rise 360ms var(--ned-ease-out) both}
.ned-scroll>*:nth-child(2),.ned-stagger>*:nth-child(2){animation-delay:40ms}
.ned-scroll>*:nth-child(3),.ned-stagger>*:nth-child(3){animation-delay:80ms}
.ned-scroll>*:nth-child(4),.ned-stagger>*:nth-child(4){animation-delay:120ms}
.ned-scroll>*:nth-child(5),.ned-stagger>*:nth-child(5){animation-delay:160ms}
.ned-scroll>*:nth-child(n+6),.ned-stagger>*:nth-child(n+6){animation-delay:200ms}
.ned-swap{animation:ned-rise 320ms var(--ned-ease-out) both}
.ned-pop{animation:ned-pop 200ms var(--ned-ease-out) both;transform-origin:top right}
.ned-sheet{animation:ned-sheet 360ms var(--ned-ease-out) both}
.ned-backdrop{animation:ned-fade 220ms var(--ned-ease) both}
a,button,label{-webkit-tap-highlight-color:transparent;transition:transform 160ms var(--ned-ease),background-color 200ms var(--ned-ease),color 200ms var(--ned-ease),box-shadow 200ms var(--ned-ease),opacity 200ms var(--ned-ease)}
a:active,button:active{transform:scale(.98)}
input,select,textarea{transition:box-shadow 180ms var(--ned-ease),background-color 180ms var(--ned-ease)}
input:focus,select:focus,textarea:focus{outline:none;background-color:#FFFFFF!important;box-shadow:0 0 0 3px rgba(123,47,190,.18)!important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="ned-screen" style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F4F6; color: #111116; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="padding: 12px 24px 8px; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2">
    <div style="font-size: 14px; font-weight: 600; color: #111116">9:41</div>
    <div style="display: flex; gap: 6px; align-items: center">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="4" width="3" height="8" rx="1" fill="#111116"></rect><rect x="4" y="2" width="3" height="10" rx="1" fill="#111116"></rect><rect x="8" y="0" width="3" height="12" rx="1" fill="#111116"></rect><rect x="12" y="2" width="3" height="10" rx="1" fill="#D4D4DC"></rect></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2" stroke="#8A8A96"></rect><rect x="2" y="2" width="15" height="8" rx="1" fill="#22C55E"></rect><rect x="22.5" y="3.5" width="2" height="5" rx="1" fill="#8A8A96"></rect></svg>
    </div>
  </div>

  <div style="padding: 4px 20px 0; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 2">
    <a href="HomeIntl.dc.html" aria-label="Back to Home" style="width: 44px; height: 44px; background: #FFFFFF; border-radius: 12px; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0; border: none; box-shadow: 0 1px 2px rgba(17,17,22,0.04), 0 6px 16px -6px rgba(17,17,22,0.10)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E5E6A" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700">Send</h1>
    <button aria-label="Scan a QR code" style="width: 44px; height: 44px; background: #FFFFFF; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; box-shadow: 0 1px 2px rgba(17,17,22,0.04), 0 6px 16px -6px rgba(17,17,22,0.10)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3F3F49" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3M7 12h10"></path></svg>
    </button>
  </div>
  <div style="padding: 16px 20px 0; position: relative; z-index: 1">
    <label for="send-q" style="display: block; font-size: 13px; font-weight: 600; color: #3F3F49">To</label>
    <div style="margin-top: 8px; display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 14px; border-radius: 16px; background: #F2EAFB; border: none">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5E5E6A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input id="send-q" value="{{q}}" onChange="{{onQ}}" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Phone, @username or name.sol" style="flex: 1; min-width: 0; height: 50px; background: transparent; border: none; outline: none; color: #111116; font-family: 'Inter', sans-serif; font-size: 16px">
      <sc-if value="{{hasQ}}" hint-placeholder-val="{{ false }}">
        <button onClick="{{clear}}" aria-label="Clear" style="width: 32px; height: 32px; border-radius: 9999px; background: #EEEEF2; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#111116" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </sc-if>
    </div>
    <div aria-live="polite" style="margin-top: 8px; font-size: 12px; color: #5E5E6A">{{modeHint}}</div>
  </div>

  <div class="ned-scroll" style="flex: 1; overflow-y: auto; padding: 8px 20px 24px; position: relative; z-index: 1">
    <sc-if value="{{showList}}" hint-placeholder-val="{{ true }}">
      <div style="margin-top: 10px; font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #5E5E6A">{{listTitle}}</div>
      <sc-for list="{{results}}" as="r" hint-placeholder-count="3">
        <a href="SendAmount.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #F0F0F3; text-decoration: none; color: #111116">
          <div style="{{r.avatar}}">{{r.initials}}</div>
          <div style="flex: 1; min-width: 0">
            <div style="display: flex; align-items: center; gap: 8px">
              <span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span>
              <sc-if value="{{r.isNed}}" hint-placeholder-val="{{ true }}">
                <span style="padding: 2px 7px; border-radius: 9999px; background: #F2EAFB; font-size: 10px; font-weight: 700; letter-spacing: 0.4px; color: #6A22B0; border: none">N.E.D</span>
              </sc-if>
              <sc-if value="{{r.isSns}}" hint-placeholder-val="{{ false }}">
                <span style="padding: 2px 7px; border-radius: 9999px; background: #EEEFFE; font-size: 10px; font-weight: 700; letter-spacing: 0.4px; color: #C7D2FE; border: none">.SOL ✓</span>
              </sc-if>
            </div>
            <div style="margin-top: 2px; font-size: 13px; color: #5E5E6A">{{r.sub}}</div>
            <sc-if value="{{r.unverified}}" hint-placeholder-val="{{ false }}">
              <div style="margin-top: 5px; display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 9999px; background: #FFF5E1; font-size: 11px; font-weight: 600; color: #8A5300; border: none">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#8A5300" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 3 2 20h20L12 3z"></path><path d="M12 10v4"></path></svg>
                Unverified number
              </div>
            </sc-if>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8A96" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
        </a>
      </sc-for>
    </sc-if>

    <sc-if value="{{notFound}}" hint-placeholder-val="{{ false }}">
      <div style="margin-top: 24px; display: flex; flex-direction: column; align-items: center; text-align: center">
        <img src="/_blob/195e0aeefc275136e89ec220d2c399a1" alt="" style="width: 150px; height: 118px; object-fit: contain">
        <div style="margin-top: 14px; font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700">Hmm, I couldn't find “{{q}}”</div>
        <div style="margin-top: 6px; max-width: 290px; font-size: 13px; line-height: 1.5; color: #5E5E6A">Check the spelling, or paste their full Solana wallet address.</div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { q: '' }; }
  renderVals() {
    var self = this;
    var people = [
      { name: 'Minh Tran', handle: '@minh', phone: '912345678', phoneMask: '+84 91 •••• 678', initials: 'MT', color: '#0E7490', kind: 'ned', verified: true },
      { name: 'Lan Pham', handle: '@lanpham', phone: '901234567', phoneMask: '+84 90 •••• 567', initials: 'LP', color: '#9D174D', kind: 'ned', verified: false },
      { name: 'anna.sol', handle: 'Solana name', phone: '', initials: 'A', color: '#4338CA', kind: 'sns', sns: 'anna.sol' }
    ];
    var raw = (this.state.q || '').trim();
    var q = raw.toLowerCase();
    var digits = q.replace(/[^0-9]/g, '').replace(/^84/, '').replace(/^0/, '');
    var mode = 'none', hits = [], hint = 'Search by phone number, N.E.D username or .sol name.';
    if (!q) { mode = 'recent'; hits = people; }
    else if (/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(raw)) {
      mode = 'address'; hint = 'Looks like a Solana wallet address.';
      hits = [{ name: raw.slice(0, 4) + '…' + raw.slice(-4), handle: 'Wallet address', initials: '◎', color: '#374151', kind: 'addr' }];
    }
    else if (q.indexOf('.sol') > 0 || q.indexOf('.') > 0) {
      mode = 'sns'; hint = 'Searching Solana names (.sol)';
      hits = people.filter(function (p) { return p.sns && p.sns.indexOf(q) === 0; });
    }
    else if (/^[+0-9 ]+$/.test(q)) {
      mode = 'phone';
      if (digits.length < 9) { hint = 'Keep typing the phone number…'; mode = 'typing'; }
      else { hint = 'Searching N.E.D by phone number'; hits = people.filter(function (p) { return p.phone && p.phone === digits; }); }
    }
    else {
      mode = 'user'; hint = 'Searching N.E.D usernames';
      var u = q.replace(/^@/, '');
      hits = people.filter(function (p) { return p.kind === 'ned' && (p.handle.slice(1).indexOf(u) === 0 || p.name.toLowerCase().indexOf(u) === 0); });
    }
    var results = hits.map(function (p) {
      var sub = p.kind === 'ned' ? p.handle + ' · ' + p.phoneMask : (p.kind === 'sns' ? 'Solana name · 8Fp3…Qx2L' : p.handle);
      return {
        name: p.name, initials: p.initials, sub: sub,
        isNed: p.kind === 'ned', isSns: p.kind === 'sns',
        unverified: p.kind === 'ned' && !p.verified && (mode === 'recent' || mode === 'phone'),
        avatar: 'width: 44px; height: 44px; border-radius: 9999px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: \'Space Grotesk\', sans-serif; font-size: 15px; font-weight: 700; color: #111116; background: ' + p.color
      };
    });
    var found = results.length > 0;
    return {
      q: this.state.q, hasQ: !!q,
      onQ: function (e) { self.setState({ q: e.target.value }); },
      clear: function () { self.setState({ q: '' }); },
      modeHint: hint,
      listTitle: mode === 'recent' ? 'Recent' : (found ? 'Found' : ''),
      results: results,
      showList: found && mode !== 'typing',
      notFound: !found && mode !== 'typing' && mode !== 'recent'
    };
  }
}
</script>
</body>
</html>
