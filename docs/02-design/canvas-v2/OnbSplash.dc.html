<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NED — Splash</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#F4F4F6}
@keyframes nedIn{0%{opacity:0;transform:scale(.9)}100%{opacity:1;transform:scale(1)}}
.ned-in{animation:nedIn .5s ease-out both}
/* N.E.D surfaces & motion v1 (see Motion & Surfaces board) */
:root{--ned-ease:cubic-bezier(.2,0,0,1);--ned-ease-out:cubic-bezier(.16,1,.3,1)}
@keyframes ned-fade{from{opacity:0}to{opacity:1}}
@keyframes ned-rise{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}
@keyframes ned-pop{from{opacity:0;transform:translate3d(0,-6px,0) scale(.97)}to{opacity:1;transform:none}}
@keyframes ned-sheet{from{transform:translate3d(0,100%,0)}to{transform:none}}
.ned-screen{animation:ned-fade 200ms var(--ned-ease) both}
.ned-screen .ned-scroll>*,.ned-stagger>*{animation:ned-rise 360ms var(--ned-ease-out) both}
.ned-scroll>*:nth-child(2),.ned-stagger>*:nth-child(2){animation-delay:40ms}
.ned-scroll>*:nth-child(3),.ned-stagger>*:nth-child(3){animation-delay:80ms}
.ned-scroll>*:nth-child(4),.ned-stagger>*:nth-child(4){animation-delay:120ms}
.ned-scroll>*:nth-child(5),.ned-stagger>*:nth-child(5){animation-delay:160ms}
.ned-scroll>*:nth-child(n+6),.ned-stagger>*:nth-child(n+6){animation-delay:200ms}
.ned-swap{animation:ned-rise 320ms var(--ned-ease-out) both}
.ned-pop{animation:ned-pop 200ms var(--ned-ease-out) both;transform-origin:top right}
.ned-sheet{animation:ned-sheet 360ms var(--ned-ease-out) both}
.ned-backdrop{animation:ned-fade 220ms var(--ned-ease) both}
a,button,label{-webkit-tap-highlight-color:transparent;transition:transform 160ms var(--ned-ease),background-color 200ms var(--ned-ease),color 200ms var(--ned-ease),box-shadow 200ms var(--ned-ease),opacity 200ms var(--ned-ease)}
a:active,button:active{transform:scale(.98)}
input,select,textarea{transition:box-shadow 180ms var(--ned-ease),background-color 180ms var(--ned-ease)}
input:focus,select:focus,textarea:focus{outline:none;background-color:#FFFFFF!important;box-shadow:0 0 0 3px rgba(123,47,190,.18)!important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="ned-screen" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; font-family: 'Inter', system-ui, sans-serif">
  <sc-if value="{{isMark}}" hint-placeholder-val="{{ true }}">
    <a href="OnbWelcome.dc.html" aria-label="N.E.D. Tap to continue" style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; color: #FFFFFF; background: #7B2FBE">
      <div class="ned-in" style="width: 112px; height: 112px; border-radius: 32px; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center"><img src="#E6E6EB" alt="" style="width: 88px; height: 90px"></div>
      <div class="ned-in" style="margin-top: 22px; font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700; letter-spacing: 6px; padding-left: 6px">N.E.D</div>
      <div style="position: absolute; bottom: 40px; font-size: 13px; color: rgba(255,255,255,0.85)">Earnings locked by code</div>
    </a>
  </sc-if>
  <sc-if value="{{isMascot}}" hint-placeholder-val="{{ false }}">
    <a href="OnbWelcome.dc.html" aria-label="N.E.D. Tap to continue" style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; color: #111116; background: #F4F4F6">
      <div class="ned-in" style="width: 220px; height: 190px; border-radius: 40px; background: #EDE3FB; display: flex; align-items: flex-end; justify-content: center; overflow: hidden"><img src="/_blob/5bb51609a7ff36b0643dc0cc23146ac6" alt="" style="width: 200px; height: 160px; object-fit: contain"></div>
      <div class="ned-in" style="margin-top: 24px; font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700; letter-spacing: 6px; padding-left: 6px">N.E.D</div>
    </a>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["mark","mascot"],"default":"mark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { var v = this.props.variant ?? 'mark'; return { isMark: v === 'mark', isMascot: v === 'mascot' }; }
}
</script>
</body>
</html>
