<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NED — Sent</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#F4F4F6}
a{color:#6A22B0}a:hover{color:#6A22B0}
.ned-scroll::-webkit-scrollbar{display:none}
.ned-scroll{scrollbar-width:none;-ms-overflow-style:none}
input::placeholder{color:#8A8A96}
@keyframes nedspin{to{transform:rotate(360deg)}}
@keyframes nedbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
/* N.E.D surfaces & motion v1 (see Motion & Surfaces board) */
:root{--ned-ease:cubic-bezier(.2,0,0,1);--ned-ease-out:cubic-bezier(.16,1,.3,1)}
@keyframes ned-fade{from{opacity:0}to{opacity:1}}
@keyframes ned-rise{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}
@keyframes ned-pop{from{opacity:0;transform:translate3d(0,-6px,0) scale(.97)}to{opacity:1;transform:none}}
@keyframes ned-sheet{from{transform:translate3d(0,100%,0)}to{transform:none}}
.ned-screen{animation:ned-fade 200ms var(--ned-ease) both}
.ned-screen .ned-scroll>*,.ned-stagger>*{animation:ned-rise 360ms var(--ned-ease-out) both}
.ned-scroll>*:nth-child(2),.ned-stagger>*:nth-child(2){animation-delay:40ms}
.ned-scroll>*:nth-child(3),.ned-stagger>*:nth-child(3){animation-delay:80ms}
.ned-scroll>*:nth-child(4),.ned-stagger>*:nth-child(4){animation-delay:120ms}
.ned-scroll>*:nth-child(5),.ned-stagger>*:nth-child(5){animation-delay:160ms}
.ned-scroll>*:nth-child(n+6),.ned-stagger>*:nth-child(n+6){animation-delay:200ms}
.ned-swap{animation:ned-rise 320ms var(--ned-ease-out) both}
.ned-pop{animation:ned-pop 200ms var(--ned-ease-out) both;transform-origin:top right}
.ned-sheet{animation:ned-sheet 360ms var(--ned-ease-out) both}
.ned-backdrop{animation:ned-fade 220ms var(--ned-ease) both}
a,button,label{-webkit-tap-highlight-color:transparent;transition:transform 160ms var(--ned-ease),background-color 200ms var(--ned-ease),color 200ms var(--ned-ease),box-shadow 200ms var(--ned-ease),opacity 200ms var(--ned-ease)}
a:active,button:active{transform:scale(.98)}
input,select,textarea{transition:box-shadow 180ms var(--ned-ease),background-color 180ms var(--ned-ease)}
input:focus,select:focus,textarea:focus{outline:none;background-color:#FFFFFF!important;box-shadow:0 0 0 3px rgba(123,47,190,.18)!important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="ned-screen" style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F4F6; color: #111116; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="padding: 12px 24px 8px; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2">
    <div style="font-size: 14px; font-weight: 600; color: #111116">9:41</div>
    <div style="display: flex; gap: 6px; align-items: center">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="4" width="3" height="8" rx="1" fill="#111116"></rect><rect x="4" y="2" width="3" height="10" rx="1" fill="#111116"></rect><rect x="8" y="0" width="3" height="12" rx="1" fill="#111116"></rect><rect x="12" y="2" width="3" height="10" rx="1" fill="#D4D4DC"></rect></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2" stroke="#8A8A96"></rect><rect x="2" y="2" width="15" height="8" rx="1" fill="#22C55E"></rect><rect x="22.5" y="3.5" width="2" height="5" rx="1" fill="#8A8A96"></rect></svg>
    </div>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; padding: 56px 24px 0; position: relative; z-index: 1">
    <img src="/_blob/22f5490f03888bc46a04dbf909a17ab4" alt="" style="width: 190px; height: 132px; object-fit: contain">
    <h1 style="margin: 20px 0 0; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; text-align: center">Sent $25.00</h1>
    <div style="margin-top: 8px; font-size: 14px; line-height: 1.5; text-align: center; color: #3F3F49">{{name}} will see it in a few seconds.</div>
    <div style="margin-top: 22px; width: 100%; padding: 4px 16px; box-sizing: border-box; border-radius: 18px; background: #FFFFFF; border: none; box-shadow: 0 1px 2px rgba(17,17,22,0.04), 0 6px 16px -6px rgba(17,17,22,0.10)">
      <sc-for list="{{rows}}" as="d" hint-placeholder-count="4">
        <div style="{{d.style}}">
          <span style="font-size: 13px; color: #5E5E6A">{{d.label}}</span>
          <span style="font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700">{{d.value}}</span>
        </div>
      </sc-for>
    </div>
    <a href="#explorer" style="margin-top: 14px; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-size: 13px; font-weight: 600; color: #6A22B0; text-decoration: none">
      View on Solana Explorer
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6A22B0" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"></path></svg>
    </a>
  </div>
  <div style="padding: 0 20px 28px; display: flex; flex-direction: column; gap: 10px; position: relative; z-index: 1">
    <a href="HomeIntl.dc.html" style="height: 52px; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 9999px; background: #7B2FBE; font-size: 16px; font-weight: 600; color: #FFFFFF; text-decoration: none">Done</a>
    <a href="SendAmount.dc.html" style="height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 9999px; background: #FFFFFF; font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 600; color: #111116; text-decoration: none; border: none; box-shadow: 0 1px 2px rgba(17,17,22,0.04), 0 6px 16px -6px rgba(17,17,22,0.10)">Send again</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"recipient":{"editor":"enum","options":["minh","lan"],"default":"minh"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var P = {
      minh: { name: 'Minh Tran', handle: '@minh', phone: '+84 91 •••• 678', initials: 'MT', color: '#0E7490', addr: '9QmT…4ZrB', verified: true },
      lan: { name: 'Lan Pham', handle: '@lanpham', phone: '+84 90 •••• 567', initials: 'LP', color: '#9D174D', addr: '3kWd…8NpA', verified: false }
    };
    var who = P[this.props.recipient ?? 'minh'] || P.minh;
    var data = [['To', who.handle], ['Amount', '25.00 USDC'], ['Network fee', '~0.000005 SOL (devnet test SOL)'], ['N.E.D fee', 'None during the pilot']];
    var rows = data.map(function (d, i) { return { label: d[0], value: d[1], style: 'display: flex; justify-content: space-between; align-items: center; padding: 11px 0;' + (i < data.length - 1 ? ' border-bottom: 1px solid #F0F0F3' : '') }; });
    return { name: who.name, rows: rows };
  }
}
</script>
</body>
</html>
