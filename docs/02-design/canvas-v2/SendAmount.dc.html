<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NED — Send, amount</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#F4F4F6}
a{color:#6A22B0}a:hover{color:#6A22B0}
.ned-scroll::-webkit-scrollbar{display:none}
.ned-scroll{scrollbar-width:none;-ms-overflow-style:none}
input::placeholder{color:#8A8A96}
@keyframes nedspin{to{transform:rotate(360deg)}}
@keyframes nedbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
/* N.E.D surfaces & motion v1 (see Motion & Surfaces board) */
:root{--ned-ease:cubic-bezier(.2,0,0,1);--ned-ease-out:cubic-bezier(.16,1,.3,1)}
@keyframes ned-fade{from{opacity:0}to{opacity:1}}
@keyframes ned-rise{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}
@keyframes ned-pop{from{opacity:0;transform:translate3d(0,-6px,0) scale(.97)}to{opacity:1;transform:none}}
@keyframes ned-sheet{from{transform:translate3d(0,100%,0)}to{transform:none}}
.ned-screen{animation:ned-fade 200ms var(--ned-ease) both}
.ned-screen .ned-scroll>*,.ned-stagger>*{animation:ned-rise 360ms var(--ned-ease-out) both}
.ned-scroll>*:nth-child(2),.ned-stagger>*:nth-child(2){animation-delay:40ms}
.ned-scroll>*:nth-child(3),.ned-stagger>*:nth-child(3){animation-delay:80ms}
.ned-scroll>*:nth-child(4),.ned-stagger>*:nth-child(4){animation-delay:120ms}
.ned-scroll>*:nth-child(5),.ned-stagger>*:nth-child(5){animation-delay:160ms}
.ned-scroll>*:nth-child(n+6),.ned-stagger>*:nth-child(n+6){animation-delay:200ms}
.ned-swap{animation:ned-rise 320ms var(--ned-ease-out) both}
.ned-pop{animation:ned-pop 200ms var(--ned-ease-out) both;transform-origin:top right}
.ned-sheet{animation:ned-sheet 360ms var(--ned-ease-out) both}
.ned-backdrop{animation:ned-fade 220ms var(--ned-ease) both}
a,button,label{-webkit-tap-highlight-color:transparent;transition:transform 160ms var(--ned-ease),background-color 200ms var(--ned-ease),color 200ms var(--ned-ease),box-shadow 200ms var(--ned-ease),opacity 200ms var(--ned-ease)}
a:active,button:active{transform:scale(.98)}
input,select,textarea{transition:box-shadow 180ms var(--ned-ease),background-color 180ms var(--ned-ease)}
input:focus,select:focus,textarea:focus{outline:none;background-color:#FFFFFF!important;box-shadow:0 0 0 3px rgba(123,47,190,.18)!important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="ned-screen" style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F4F6; color: #111116; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="padding: 12px 24px 8px; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2">
    <div style="font-size: 14px; font-weight: 600; color: #111116">9:41</div>
    <div style="display: flex; gap: 6px; align-items: center">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="4" width="3" height="8" rx="1" fill="#111116"></rect><rect x="4" y="2" width="3" height="10" rx="1" fill="#111116"></rect><rect x="8" y="0" width="3" height="12" rx="1" fill="#111116"></rect><rect x="12" y="2" width="3" height="10" rx="1" fill="#D4D4DC"></rect></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2" stroke="#8A8A96"></rect><rect x="2" y="2" width="15" height="8" rx="1" fill="#22C55E"></rect><rect x="22.5" y="3.5" width="2" height="5" rx="1" fill="#8A8A96"></rect></svg>
    </div>
  </div>

  <div style="padding: 4px 20px 0; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 2">
    <a href="SendRecipient.dc.html" aria-label="Back to recipients" style="width: 44px; height: 44px; background: #FFFFFF; border-radius: 12px; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0; border: none; box-shadow: 0 1px 2px rgba(17,17,22,0.04), 0 6px 16px -6px rgba(17,17,22,0.10)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E5E6A" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700">Send</h1>
    <div style="width: 44px; height: 44px"></div>
  </div>
  <div style="padding: 14px 20px 0; position: relative; z-index: 1">
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; background: #FFFFFF; border: none; box-shadow: 0 1px 2px rgba(17,17,22,0.04), 0 6px 16px -6px rgba(17,17,22,0.10)">
      <div style="{{avatar}}">{{initials}}</div>
      <div style="flex: 1; min-width: 0">
        <div style="font-size: 15px; font-weight: 600">{{name}}</div>
        <div style="margin-top: 2px; font-size: 12px; color: #5E5E6A">{{handle}} · {{phone}}</div>
      </div>
      <sc-if value="{{unverified}}" hint-placeholder-val="{{ false }}">
        <span style="padding: 3px 8px; border-radius: 9999px; background: #FFF5E1; font-size: 10px; font-weight: 700; color: #8A5300; border: none">UNVERIFIED</span>
      </sc-if>
      <sc-if value="{{verified}}" hint-placeholder-val="{{ true }}">
        <span style="padding: 3px 8px; border-radius: 9999px; background: #F2EAFB; font-size: 10px; font-weight: 700; color: #6A22B0; border: none">N.E.D</span>
      </sc-if>
    </div>
  </div>
  <div style="padding: 22px 20px 0; text-align: center; position: relative; z-index: 1">
    <div style="font-family: 'Space Grotesk', sans-serif; font-size: 52px; font-weight: 700; letter-spacing: -2px; line-height: 1.05">${{amount}}</div>
    <div style="{{hintStyle}}">{{hint}}</div>
  </div>
  <div style="margin: 16px 20px 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; position: relative; z-index: 1">
    <sc-for list="{{quick}}" as="c" hint-placeholder-count="4">
      <button onClick="{{c.pick}}" style="height: 38px; border-radius: 12px; background: #FFFFFF; color: #111116; font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; border: none; box-shadow: 0 1px 2px rgba(17,17,22,0.04), 0 6px 16px -6px rgba(17,17,22,0.10)">{{c.label}}</button>
    </sc-for>
  </div>
  <div style="margin: 12px 20px 0; display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; border-radius: 14px; background: #FFFFFF; position: relative; z-index: 1; border: none; box-shadow: 0 1px 2px rgba(17,17,22,0.04), 0 6px 16px -6px rgba(17,17,22,0.10)">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5E5E6A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path></svg>
    <input aria-label="Note for recipient" value="{{note}}" onChange="{{onNote}}" maxlength="60" placeholder="Add a note (optional)" style="flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: #111116; font-family: 'Inter', sans-serif; font-size: 14px">
  </div>
  <div style="margin: 10px 24px 0; display: flex; justify-content: space-between; font-size: 12px; position: relative; z-index: 1">
    <span style="color: #5E5E6A">From your wallet · 30.00 USDC available</span>
    <span style="color: #5E5E6A">Network fee ~0.000005 SOL</span>
  </div>
  <div style="flex: 1"></div>
  <div style="padding: 0 20px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; position: relative; z-index: 1">
    <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
      <button onClick="{{k.press}}" aria-label="{{k.aria}}" style="height: 50px; background: transparent; border: none; border-radius: 12px; cursor: pointer; color: #111116; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 500">{{k.label}}</button>
    </sc-for>
  </div>
  <div style="padding: 8px 20px 28px; position: relative; z-index: 1">
    <sc-if value="{{ready}}" hint-placeholder-val="{{ true }}">
      <a href="SendReview.dc.html" style="height: 52px; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 9999px; background: #7B2FBE; font-size: 16px; font-weight: 600; color: #FFFFFF; text-decoration: none">Review</a>
    </sc-if>
    <sc-if value="{{notReady}}" hint-placeholder-val="{{ false }}">
      <div aria-disabled="true" style="height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 9999px; background: #E6E6EB; font-size: 16px; font-weight: 600; color: #8A8A96">Review</div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"recipient":{"editor":"enum","options":["minh","lan"],"default":"minh"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { amt: '25', note: 'Coffee' }; }
  renderVals() {
    var self = this;
    var P = {
      minh: { name: 'Minh Tran', handle: '@minh', phone: '+84 91 •••• 678', initials: 'MT', color: '#0E7490', addr: '9QmT…4ZrB', verified: true },
      lan: { name: 'Lan Pham', handle: '@lanpham', phone: '+84 90 •••• 567', initials: 'LP', color: '#9D174D', addr: '3kWd…8NpA', verified: false }
    };
    var who = P[this.props.recipient ?? 'minh'] || P.minh;
    var bal = 30, amt = this.state.amt, v = parseFloat(amt) || 0;
    function press(k) {
      var a = self.state.amt;
      if (k === 'del') a = a.length > 1 ? a.slice(0, -1) : '0';
      else if (k === '.') { if (a.indexOf('.') < 0) a = a + '.'; }
      else {
        if (a === '0') a = k;
        else if (a.indexOf('.') >= 0 && a.split('.')[1].length >= 2) return;
        else if (a.replace('.', '').length >= 7) return;
        else a = a + k;
      }
      self.setState({ amt: a });
    }
    var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '.', '0', 'del'].map(function (k) {
      return { label: k === 'del' ? '⌫' : k, aria: k === 'del' ? 'Delete' : (k === '.' ? 'Decimal point' : k), press: function () { press(k); } };
    });
    var quick = [['$5', '5'], ['$10', '10'], ['$20', '20'], ['$50', '50']].map(function (q) {
      return { label: q[0], pick: function () { self.setState({ amt: q[1] }); } };
    });
    var over = v > bal;
    var ready = v > 0 && !over;
    return {
      name: who.name, handle: who.handle, phone: who.phone, initials: who.initials,
      verified: who.verified, unverified: !who.verified,
      avatar: 'width: 44px; height: 44px; border-radius: 9999px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: \'Space Grotesk\', sans-serif; font-size: 15px; font-weight: 700; color: #111116; background: ' + who.color,
      amount: amt, keys: keys, quick: quick,
      note: this.state.note, onNote: function (e) { self.setState({ note: e.target.value }); },
      hint: over ? 'Not enough USDC. Available: 30.00 USDC' : '≈ ' + v.toFixed(2) + ' USDC',
      hintStyle: 'margin-top: 8px; font-size: 13px; font-weight: ' + (over ? '600' : '400') + '; color: ' + (over ? '#DC2626' : '#5E5E6A'),
      ready: ready, notReady: !ready
    };
  }
}
</script>
</body>
</html>
