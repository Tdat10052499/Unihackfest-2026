<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NED xStocks — Review</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; background: linear-gradient(170deg, #110822 0%, #0D0618 30%, #080812 60%, #06060E 100%); color: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <div style="position: absolute; top: 90px; left: 50%; margin-left: -160px; width: 320px; height: 220px; background: radial-gradient(ellipse, rgba(123,47,190,0.2) 0%, transparent 65%); pointer-events: none"></div>

  <!-- Status Bar -->
  <div style="padding: 12px 24px 8px; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2">
    <div style="font-size: 14px; font-weight: 600; color: #FFFFFF">9:41</div>
    <div style="display: flex; gap: 6px; align-items: center">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="4" width="3" height="8" rx="1" fill="#FFFFFF"></rect><rect x="4" y="2" width="3" height="10" rx="1" fill="#FFFFFF"></rect><rect x="8" y="0" width="3" height="12" rx="1" fill="#FFFFFF"></rect><rect x="12" y="2" width="3" height="10" rx="1" fill="rgba(255,255,255,0.25)"></rect></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2" stroke="rgba(255,255,255,0.3)"></rect><rect x="2" y="2" width="15" height="8" rx="1" fill="#22C55E"></rect><rect x="22.5" y="3.5" width="2" height="5" rx="1" fill="rgba(255,255,255,0.3)"></rect></svg>
    </div>
  </div>

  <!-- Header -->
  <div style="padding: 4px 20px 0; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 2">
    <a href="{{backHref}}" aria-label="Back" style="width: 44px; height: 44px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700">{{title}}</h1>
    <div style="width: 44px; height: 44px"></div>
  </div>

  <!-- Headline -->
  <div style="padding: 20px 20px 0; text-align: center; position: relative; z-index: 1">
    <div style="display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px 5px 5px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 9999px">
      <div style="width: 24px; height: 24px; border-radius: 9999px; background: rgba(148,163,184,0.2); display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 700; color: #E2E8F0">A</div>
      <div style="font-size: 13px; font-weight: 600">{{verb}} Apple</div>
    </div>
    <div style="margin-top: 12px; font-family: 'Space Grotesk', sans-serif; font-size: 44px; font-weight: 700; letter-spacing: -1.5px; line-height: 1">{{headline}}</div>
    <div style="margin-top: 8px; font-family: 'Space Mono', monospace; font-size: 13px; color: rgba(255,255,255,0.65)">{{sub}}</div>
  </div>

  <!-- Details -->
  <div style="margin: 20px 20px 0; padding: 4px 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09); border-radius: 18px; position: relative; z-index: 1">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
      <div style="{{r.rowStyle}}">
        <div style="font-size: 13px; color: rgba(255,255,255,0.6)">{{r.label}}</div>
        <div style="{{r.valueStyle}}">{{r.value}}</div>
      </div>
    </sc-for>
  </div>

  <sc-if value="{{marketClosed}}" hint-placeholder-val="{{ true }}">
    <div style="margin: 10px 24px 0; display: flex; gap: 8px; align-items: flex-start; font-size: 11px; line-height: 1.45; color: rgba(255,255,255,0.7); position: relative; z-index: 1">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      <div>US market is closed, so this price comes from on-chain trading and may differ from Friday's close.</div>
    </div>
  </sc-if>

  <div style="flex: 1"></div>

  <!-- First-time disclosure -->
  <sc-if value="{{firstTime}}" hint-placeholder-val="{{ true }}">
    <div style="margin: 0 20px 12px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; background: rgba(99,102,241,0.1); border: 1px solid rgba(129,140,248,0.28); border-radius: 14px; position: relative; z-index: 1">
      <input id="xs-ack" type="checkbox" checked="{{agreed}}" onChange="{{toggleAgree}}" style="width: 20px; height: 20px; margin: 1px 0 0; accent-color: #9B4FDE; flex-shrink: 0; cursor: pointer">
      <label for="xs-ack" style="font-size: 12px; line-height: 1.5; color: rgba(255,255,255,0.8); cursor: pointer">I understand AAPLx tracks Apple's share price but is not an Apple share: no voting rights, and its value can go down.</label>
    </div>
  </sc-if>

  <!-- Slide to confirm -->
  <div style="padding: 0 20px 28px; position: relative; z-index: 1">
    <sc-if value="{{canConfirm}}" hint-placeholder-val="{{ true }}">
      <a href="{{successHref}}" style="height: 60px; padding: 5px; box-sizing: border-box; display: flex; align-items: center; border-radius: 9999px; background: linear-gradient(135deg, rgba(123,47,190,0.55), rgba(99,102,241,0.4)); border: 1px solid rgba(155,79,222,0.5); text-decoration: none; position: relative">
        <div style="width: 50px; height: 50px; border-radius: 9999px; background: linear-gradient(135deg, #9B4FDE, #6366F1); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(123,47,190,0.45); flex-shrink: 0">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
        </div>
        <div style="flex: 1; text-align: center; margin-left: -50px; font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 700; color: #FFFFFF">{{slideLabel}}</div>
      </a>
    </sc-if>
    <sc-if value="{{locked}}" hint-placeholder-val="{{ false }}">
      <div aria-disabled="true" style="height: 60px; padding: 5px; box-sizing: border-box; display: flex; align-items: center; border-radius: 9999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1)">
        <div style="width: 50px; height: 50px; border-radius: 9999px; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
        </div>
        <div style="flex: 1; text-align: center; margin-left: -50px; font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.45)">Tick the box to continue</div>
      </div>
    </sc-if>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"side":{"editor":"enum","options":["buy","sell"],"default":"buy"},"firstTime":{"editor":"boolean","default":true},"marketOpen":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { agreed: false };
  }
  renderVals() {
    var self = this;
    var side = this.props.side ?? 'buy';
    var first = this.props.firstTime ?? true;
    var open = this.props.marketOpen ?? false;
    var mono = 'font-family: \'Space Mono\', monospace; font-size: 13px; font-weight: 700; color: #FFFFFF';
    var green = 'font-family: \'Space Mono\', monospace; font-size: 13px; font-weight: 700; color: #4ADE80';
    var plain = 'font-size: 13px; font-weight: 600; color: #FFFFFF';
    var buy = side !== 'sell';
    var data = buy ? [
      ['Price per share', '$243.42', mono],
      ['You pay', '$50.00 USDC', mono],
      ['N.E.D fee (0.25%)', '$0.13', mono],
      ['You get (est.)', '0.2049 AAPLx', mono],
      ['Minimum you get', '0.2028 AAPLx', mono],
      ['Price impact', '< 0.1%', green],
      ['Route', 'Jupiter', plain]
    ] : [
      ['Price per share', '$243.42', mono],
      ['You sell', '0.2465 AAPLx', mono],
      ['N.E.D fee (0.25%)', '$0.15', mono],
      ['You get (est.)', '$59.85 USDC', mono],
      ['Minimum you get', '$59.25 USDC', mono],
      ['Gain on this sale', '+$1.16', green],
      ['Route', 'Jupiter', plain]
    ];
    var rows = data.map(function (d, i) {
      return {
        label: d[0], value: d[1], valueStyle: d[2],
        rowStyle: 'display: flex; justify-content: space-between; align-items: center; padding: 11px 0;' + (i < data.length - 1 ? ' border-bottom: 1px solid rgba(255,255,255,0.06)' : '')
      };
    });
    var agreed = this.state.agreed;
    var can = !first || agreed;
    return {
      title: buy ? 'Review order' : 'Review sale',
      verb: buy ? 'Buy' : 'Sell',
      headline: buy ? '$50.00' : '$60.00',
      sub: buy ? '≈ 0.2049 AAPLx' : '0.2465 AAPLx → ≈ $59.85 USDC',
      rows: rows,
      marketClosed: !open,
      firstTime: first, agreed: agreed,
      toggleAgree: function () { self.setState({ agreed: !self.state.agreed }); },
      canConfirm: can, locked: !can,
      slideLabel: buy ? 'Slide to buy' : 'Slide to sell',
      backHref: buy ? 'XStockBuy.dc.html' : 'XStockSell.dc.html',
      successHref: buy ? 'XStockSuccess.dc.html' : 'XStockSellSuccess.dc.html'
    };
  }
}
</script>
</body>
</html>
