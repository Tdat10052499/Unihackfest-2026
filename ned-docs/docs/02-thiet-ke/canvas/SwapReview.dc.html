<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NED — Swap, review</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#080812}
a{color:#B87AED}a:hover{color:#D4AEF6}
.ned-scroll::-webkit-scrollbar{display:none}
.ned-scroll{scrollbar-width:none;-ms-overflow-style:none}
input::placeholder{color:rgba(255,255,255,0.35)}
@keyframes nedspin{to{transform:rotate(360deg)}}
@keyframes nedbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(170deg, #110822 0%, #0D0618 30%, #080812 60%, #06060E 100%); color: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="padding: 12px 24px 8px; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2">
    <div style="font-size: 14px; font-weight: 600; color: #FFFFFF">9:41</div>
    <div style="display: flex; gap: 6px; align-items: center">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="4" width="3" height="8" rx="1" fill="#FFFFFF"></rect><rect x="4" y="2" width="3" height="10" rx="1" fill="#FFFFFF"></rect><rect x="8" y="0" width="3" height="12" rx="1" fill="#FFFFFF"></rect><rect x="12" y="2" width="3" height="10" rx="1" fill="rgba(255,255,255,0.25)"></rect></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2" stroke="rgba(255,255,255,0.3)"></rect><rect x="2" y="2" width="15" height="8" rx="1" fill="#22C55E"></rect><rect x="22.5" y="3.5" width="2" height="5" rx="1" fill="rgba(255,255,255,0.3)"></rect></svg>
    </div>
  </div>

  <div style="padding: 4px 20px 0; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 2">
    <a href="SwapV1.dc.html" aria-label="Back to swap" style="width: 44px; height: 44px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700">Review swap</h1>
    <div style="width: 44px; height: 44px"></div>
  </div>
  <div style="padding: 16px 20px 0; position: relative; z-index: 1">
    <div style="padding: 16px; border-radius: 20px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1)">
      <div style="display: flex; align-items: center; gap: 12px">
        <div style="{{payIcon}}">{{payMono}}</div>
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 12px; color: rgba(255,255,255,0.6)">You pay</div>
          <div style="margin-top: 2px; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: -0.5px">{{payAmt}}</div>
        </div>
        <div style="font-family: 'Space Mono', monospace; font-size: 13px; color: rgba(255,255,255,0.6)">{{payUsd}}</div>
      </div>
      <div style="margin: 10px 0 10px 17px; width: 2px; height: 16px; background: rgba(184,122,237,0.5); border-radius: 2px"></div>
      <div style="display: flex; align-items: center; gap: 12px">
        <div style="{{getIcon}}">{{getMono}}</div>
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 12px; color: rgba(255,255,255,0.6)">You get (estimate)</div>
          <div style="margin-top: 2px; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: -0.5px">{{getAmt}}</div>
        </div>
        <div style="font-family: 'Space Mono', monospace; font-size: 13px; color: rgba(255,255,255,0.6)">{{getUsd}}</div>
      </div>
    </div>

    <div style="margin-top: 12px; padding: 2px 16px; border-radius: 18px; background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.08)">
      <sc-for list="{{rows}}" as="d" hint-placeholder-count="7">
        <div style="{{d.style}}">
          <span style="font-size: 13px; color: rgba(255,255,255,0.6)">{{d.label}}</span>
          <span style="{{d.valueStyle}}">{{d.value}}</span>
        </div>
      </sc-for>
    </div>

    <sc-if value="{{showTimer}}" hint-placeholder-val="{{ true }}">
      <div style="margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 12px; color: rgba(255,255,255,0.6)">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" style="transform: rotate(-90deg)"><circle cx="9" cy="9" r="7" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="2"></circle><circle cx="9" cy="9" r="7" fill="none" stroke="#B87AED" stroke-width="2" stroke-linecap="round" stroke-dasharray="44" stroke-dashoffset="{{ringOff}}"></circle></svg>
        <span>Price updates in {{t}}s</span>
      </div>
    </sc-if>

    <sc-if value="{{showMoved}}" hint-placeholder-val="{{ false }}">
      <div role="status" style="margin-top: 10px; padding: 12px 14px; border-radius: 14px; background: rgba(245,158,11,0.1); border: 1px solid rgba(251,191,36,0.35); display: flex; align-items: center; gap: 10px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"></path></svg>
        <div style="flex: 1; font-size: 12px; line-height: 1.45; color: rgba(255,255,255,0.88)"><strong style="color: #FCD34D">Price updated.</strong> You now get ≈ 147.63 USDC (−0.35%).</div>
        <button onClick="{{accept}}" style="height: 36px; padding: 0 12px; border-radius: 10px; background: #FBBF24; border: none; color: #1A1206; font-size: 12px; font-weight: 700; cursor: pointer">Accept</button>
      </div>
    </sc-if>
  </div>

  <div style="flex: 1"></div>
  <div style="padding: 0 20px 28px; position: relative; z-index: 1">
    <sc-if value="{{canConfirm}}" hint-placeholder-val="{{ true }}">
      <a href="SwapSuccess.dc.html" style="height: 60px; padding: 5px; box-sizing: border-box; display: flex; align-items: center; border-radius: 9999px; background: linear-gradient(135deg, rgba(123,47,190,0.55), rgba(99,102,241,0.4)); border: 1px solid rgba(155,79,222,0.5); text-decoration: none">
        <div style="width: 50px; height: 50px; border-radius: 9999px; background: linear-gradient(135deg, #9B4FDE, #6366F1); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(123,47,190,0.45); flex-shrink: 0">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
        </div>
        <div style="flex: 1; text-align: center; margin-left: -50px; font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 700; color: #FFFFFF">Slide to swap</div>
      </a>
    </sc-if>
    <sc-if value="{{locked}}" hint-placeholder-val="{{ false }}">
      <div aria-disabled="true" style="height: 60px; padding: 5px; box-sizing: border-box; display: flex; align-items: center; border-radius: 9999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1)">
        <div style="width: 50px; height: 50px; border-radius: 9999px; background: rgba(255,255,255,0.1); flex-shrink: 0"></div>
        <div style="flex: 1; text-align: center; margin-left: -50px; font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.5)">Accept the new price to continue</div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"priceMoved":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { accepted: false, t: 15 }; }
  componentDidMount() { var self = this; this.timer = setInterval(function () { var t = self.state.t - 1; self.setState({ t: t <= 0 ? 15 : t }); }, 1000); }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    var self = this;
    function icon(color, size) { return 'width: ' + size + 'px; height: ' + size + 'px; border-radius: 9999px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: \'Space Grotesk\', sans-serif; font-size: ' + Math.round(size * 0.42) + 'px; font-weight: 700; color: #FFFFFF; background: ' + color; }
    var moved = (this.props.priceMoved ?? false) && !this.state.accepted;
    var acceptedNew = (this.props.priceMoved ?? false) && this.state.accepted;
    var get = acceptedNew ? '147.63' : '148.15';
    var minGet = acceptedNew ? '146.89' : '147.41';
    var mono = "font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; color: #FFFFFF";
    var plain = 'font-size: 13px; font-weight: 600; color: #FFFFFF';
    var green = 'font-size: 13px; font-weight: 600; color: #86EFAC';
    var data = [
      ['Rate', acceptedNew ? '1 SOL = 148.00 USDC' : '1 SOL = 148.52 USDC', mono],
      ['N.E.D fee (0.25%)', '$0.37', mono],
      ['Network fee', 'Free · paid by N.E.D', green],
      ['Price impact', '< 0.1%', green],
      ['Max price change', 'Auto (0.5%)', plain],
      ['Minimum you get', minGet + ' USDC', mono],
      ['Route', 'Jupiter', plain]
    ];
    var rows = data.map(function (d, i) {
      return { label: d[0], value: d[1], valueStyle: d[2], style: 'display: flex; justify-content: space-between; align-items: center; padding: 10px 0;' + (i < data.length - 1 ? ' border-bottom: 1px solid rgba(255,255,255,0.06)' : '') };
    });
    return {
      payIcon: icon('#7B3FE4', 36), payMono: 'S', payAmt: '1.00 SOL', payUsd: '$148.52',
      getIcon: icon('#2775CA', 36), getMono: 'U', getAmt: '≈ ' + get + ' USDC', getUsd: '$' + get,
      rows: rows, t: this.state.t, ringOff: (44 * (1 - this.state.t / 15)).toFixed(1),
      showTimer: !moved, showMoved: moved,
      accept: function () { self.setState({ accepted: true }); },
      canConfirm: !moved, locked: moved
    };
  }
}
</script>
</body>
</html>
