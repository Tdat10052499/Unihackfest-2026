<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NED — Send, amount</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#080812}
a{color:#B87AED}a:hover{color:#D4AEF6}
.ned-scroll::-webkit-scrollbar{display:none}
.ned-scroll{scrollbar-width:none;-ms-overflow-style:none}
input::placeholder{color:rgba(255,255,255,0.35)}
@keyframes nedspin{to{transform:rotate(360deg)}}
@keyframes nedbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(170deg, #110822 0%, #0D0618 30%, #080812 60%, #06060E 100%); color: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="padding: 12px 24px 8px; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2">
    <div style="font-size: 14px; font-weight: 600; color: #FFFFFF">9:41</div>
    <div style="display: flex; gap: 6px; align-items: center">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="4" width="3" height="8" rx="1" fill="#FFFFFF"></rect><rect x="4" y="2" width="3" height="10" rx="1" fill="#FFFFFF"></rect><rect x="8" y="0" width="3" height="12" rx="1" fill="#FFFFFF"></rect><rect x="12" y="2" width="3" height="10" rx="1" fill="rgba(255,255,255,0.25)"></rect></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2" stroke="rgba(255,255,255,0.3)"></rect><rect x="2" y="2" width="15" height="8" rx="1" fill="#22C55E"></rect><rect x="22.5" y="3.5" width="2" height="5" rx="1" fill="rgba(255,255,255,0.3)"></rect></svg>
    </div>
  </div>

  <div style="padding: 4px 20px 0; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 2">
    <a href="SendRecipient.dc.html" aria-label="Back to recipients" style="width: 44px; height: 44px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700">Send</h1>
    <div style="width: 44px; height: 44px"></div>
  </div>
  <div style="padding: 14px 20px 0; position: relative; z-index: 1">
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1)">
      <div style="{{avatar}}">{{initials}}</div>
      <div style="flex: 1; min-width: 0">
        <div style="font-size: 15px; font-weight: 600">{{name}}</div>
        <div style="margin-top: 2px; font-size: 12px; color: rgba(255,255,255,0.58)">{{handle}} · {{phone}}</div>
      </div>
      <sc-if value="{{unverified}}" hint-placeholder-val="{{ false }}">
        <span style="padding: 3px 8px; border-radius: 9999px; background: rgba(245,158,11,0.14); border: 1px solid rgba(251,191,36,0.35); font-size: 10px; font-weight: 700; color: #FCD34D">UNVERIFIED</span>
      </sc-if>
      <sc-if value="{{verified}}" hint-placeholder-val="{{ true }}">
        <span style="padding: 3px 8px; border-radius: 9999px; background: rgba(155,79,222,0.2); border: 1px solid rgba(184,122,237,0.4); font-size: 10px; font-weight: 700; color: #D8B4FE">N.E.D</span>
      </sc-if>
    </div>
  </div>
  <div style="padding: 22px 20px 0; text-align: center; position: relative; z-index: 1">
    <div style="font-family: 'Space Grotesk', sans-serif; font-size: 52px; font-weight: 700; letter-spacing: -2px; line-height: 1.05">${{amount}}</div>
    <div style="{{hintStyle}}">{{hint}}</div>
  </div>
  <div style="margin: 16px 20px 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; position: relative; z-index: 1">
    <sc-for list="{{quick}}" as="c" hint-placeholder-count="4">
      <button onClick="{{c.pick}}" style="height: 38px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); color: #FFFFFF; font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer">{{c.label}}</button>
    </sc-for>
  </div>
  <div style="margin: 12px 20px 0; display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09); position: relative; z-index: 1">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path></svg>
    <input aria-label="Note for recipient" value="{{note}}" onChange="{{onNote}}" maxlength="60" placeholder="Add a note (optional)" style="flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: #FFFFFF; font-family: 'Inter', sans-serif; font-size: 14px">
  </div>
  <div style="margin: 10px 24px 0; display: flex; justify-content: space-between; font-size: 12px; position: relative; z-index: 1">
    <span style="color: rgba(255,255,255,0.58)">From Cash · $750.00 available</span>
    <span style="color: #86EFAC; font-weight: 600">No fee</span>
  </div>
  <div style="flex: 1"></div>
  <div style="padding: 0 20px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; position: relative; z-index: 1">
    <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
      <button onClick="{{k.press}}" aria-label="{{k.aria}}" style="height: 50px; background: transparent; border: none; border-radius: 12px; cursor: pointer; color: #FFFFFF; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 500">{{k.label}}</button>
    </sc-for>
  </div>
  <div style="padding: 8px 20px 28px; position: relative; z-index: 1">
    <sc-if value="{{ready}}" hint-placeholder-val="{{ true }}">
      <a href="SendReview.dc.html" style="height: 56px; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 16px; background: linear-gradient(135deg, #7B2FBE 0%, #9B4FDE 50%, #6366F1 100%); font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700; color: #FFFFFF; text-decoration: none">Review</a>
    </sc-if>
    <sc-if value="{{notReady}}" hint-placeholder-val="{{ false }}">
      <div aria-disabled="true" style="height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 16px; background: rgba(255,255,255,0.08); font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700; color: rgba(255,255,255,0.4)">Review</div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"recipient":{"editor":"enum","options":["minh","lan"],"default":"minh"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { amt: '25', note: 'Coffee' }; }
  renderVals() {
    var self = this;
    var P = {
      minh: { name: 'Minh Tran', handle: '@minh', phone: '+84 91 •••• 678', initials: 'MT', color: '#0E7490', addr: '9QmT…4ZrB', verified: true },
      lan: { name: 'Lan Pham', handle: '@lanpham', phone: '+84 90 •••• 567', initials: 'LP', color: '#9D174D', addr: '3kWd…8NpA', verified: false }
    };
    var who = P[this.props.recipient ?? 'minh'] || P.minh;
    var bal = 750, amt = this.state.amt, v = parseFloat(amt) || 0;
    function press(k) {
      var a = self.state.amt;
      if (k === 'del') a = a.length > 1 ? a.slice(0, -1) : '0';
      else if (k === '.') { if (a.indexOf('.') < 0) a = a + '.'; }
      else {
        if (a === '0') a = k;
        else if (a.indexOf('.') >= 0 && a.split('.')[1].length >= 2) return;
        else if (a.replace('.', '').length >= 7) return;
        else a = a + k;
      }
      self.setState({ amt: a });
    }
    var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '.', '0', 'del'].map(function (k) {
      return { label: k === 'del' ? '⌫' : k, aria: k === 'del' ? 'Delete' : (k === '.' ? 'Decimal point' : k), press: function () { press(k); } };
    });
    var quick = [['$5', '5'], ['$10', '10'], ['$20', '20'], ['$50', '50']].map(function (q) {
      return { label: q[0], pick: function () { self.setState({ amt: q[1] }); } };
    });
    var over = v > bal;
    var ready = v > 0 && !over;
    return {
      name: who.name, handle: who.handle, phone: who.phone, initials: who.initials,
      verified: who.verified, unverified: !who.verified,
      avatar: 'width: 44px; height: 44px; border-radius: 9999px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: \'Space Grotesk\', sans-serif; font-size: 15px; font-weight: 700; color: #FFFFFF; background: ' + who.color,
      amount: amt, keys: keys, quick: quick,
      note: this.state.note, onNote: function (e) { self.setState({ note: e.target.value }); },
      hint: over ? 'Not enough in Cash. Available: $750.00' : '≈ ' + v.toFixed(2) + ' USDC',
      hintStyle: 'margin-top: 8px; font-size: 13px; font-weight: ' + (over ? '600' : '400') + '; color: ' + (over ? '#F87171' : 'rgba(255,255,255,0.6)'),
      ready: ready, notReady: !ready
    };
  }
}
</script>
</body>
</html>
