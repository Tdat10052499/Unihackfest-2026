<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NED — Setting up</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#080812}
a{color:#B87AED}a:hover{color:#D4AEF6}
.ned-scroll::-webkit-scrollbar{display:none}
.ned-scroll{scrollbar-width:none;-ms-overflow-style:none}
input::placeholder{color:rgba(255,255,255,0.35)}
@keyframes nedspin{to{transform:rotate(360deg)}}
@keyframes nedbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(170deg, #110822 0%, #0D0618 30%, #080812 60%, #06060E 100%); color: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <div style="position: absolute; top: 120px; left: 50%; margin-left: -190px; width: 380px; height: 360px; background: radial-gradient(circle, rgba(99,102,241,0.26) 0%, transparent 65%); pointer-events: none"></div>
  <div style="padding: 12px 24px 8px; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2">
    <div style="font-size: 14px; font-weight: 600; color: #FFFFFF">9:41</div>
    <div style="display: flex; gap: 6px; align-items: center">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="4" width="3" height="8" rx="1" fill="#FFFFFF"></rect><rect x="4" y="2" width="3" height="10" rx="1" fill="#FFFFFF"></rect><rect x="8" y="0" width="3" height="12" rx="1" fill="#FFFFFF"></rect><rect x="12" y="2" width="3" height="10" rx="1" fill="rgba(255,255,255,0.25)"></rect></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2" stroke="rgba(255,255,255,0.3)"></rect><rect x="2" y="2" width="15" height="8" rx="1" fill="#22C55E"></rect><rect x="22.5" y="3.5" width="2" height="5" rx="1" fill="rgba(255,255,255,0.3)"></rect></svg>
    </div>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; padding: 70px 28px 0; position: relative; z-index: 1">
    <img src="/_blob/3385a7c81923ce262d24f4cda7f87bcd" alt="" style="width: 200px; height: 156px; object-fit: contain">
    <h1 style="margin: 26px 0 0; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; text-align: center">{{heading}}</h1>
    <p style="margin: 8px 0 0; font-size: 14px; line-height: 1.5; text-align: center; color: rgba(255,255,255,0.65)">{{subheading}}</p>
    <div role="list" style="margin-top: 30px; width: 100%; display: flex; flex-direction: column; gap: 14px">
      <sc-for list="{{steps}}" as="st" hint-placeholder-count="3">
        <div role="listitem" style="display: flex; align-items: center; gap: 12px">
          <sc-if value="{{st.done}}" hint-placeholder-val="{{ true }}">
            <div style="width: 24px; height: 24px; border-radius: 9999px; background: rgba(34,197,94,0.18); border: 1px solid rgba(74,222,128,0.5); display: flex; align-items: center; justify-content: center; flex-shrink: 0">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#4ADE80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
            </div>
          </sc-if>
          <sc-if value="{{st.active}}" hint-placeholder-val="{{ false }}">
            <div style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 9999px; border: 2px solid rgba(255,255,255,0.15); border-top-color: #B87AED; animation: nedspin 0.9s linear infinite; flex-shrink: 0"></div>
          </sc-if>
          <sc-if value="{{st.waiting}}" hint-placeholder-val="{{ false }}">
            <div style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 9999px; border: 2px solid rgba(255,255,255,0.15); flex-shrink: 0"></div>
          </sc-if>
          <div style="{{st.style}}">{{st.label}}</div>
        </div>
      </sc-for>
    </div>
    <div style="flex: 1"></div>
    <div style="width: 100%; padding-bottom: 28px">
      <sc-if value="{{doneNew}}" hint-placeholder-val="{{ false }}">
        <a href="OnbProfile.dc.html" style="height: 56px; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 16px; background: linear-gradient(135deg, #7B2FBE 0%, #9B4FDE 50%, #6366F1 100%); font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700; color: #FFFFFF; text-decoration: none">Continue</a>
      </sc-if>
      <sc-if value="{{doneBack}}" hint-placeholder-val="{{ false }}">
        <a href="HomeV4.dc.html" style="height: 56px; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 16px; background: linear-gradient(135deg, #7B2FBE 0%, #9B4FDE 50%, #6366F1 100%); font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700; color: #FFFFFF; text-decoration: none">Go to my wallet</a>
      </sc-if>
      <sc-if value="{{working}}" hint-placeholder-val="{{ true }}">
        <div style="height: 56px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; color: rgba(255,255,255,0.5)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
          Secured with MPC. No recovery phrase to write down.
        </div>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"returning":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { step: 0 }; }
  componentDidMount() {
    var self = this;
    this.timer = setInterval(function () {
      if (self.state.step >= 3) { clearInterval(self.timer); return; }
      self.setState({ step: self.state.step + 1 });
    }, 1100);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    var back = this.props.returning ?? false;
    var step = this.state.step;
    var labels = ['Signed in with Google', 'Securing your wallet', back ? 'Found your N.E.D profile' : 'Checking for a N.E.D profile'];
    var steps = labels.map(function (l, i) {
      var done = i < step, active = i === step;
      return { label: l, done: done, active: active, waiting: !done && !active,
        style: 'font-size: 15px; font-weight: ' + (active ? '600' : '500') + '; color: ' + (done || active ? '#FFFFFF' : 'rgba(255,255,255,0.45)') };
    });
    var finished = step >= 3;
    return {
      steps: steps,
      heading: finished ? (back ? 'Welcome back, tdat!' : 'Your wallet is ready') : 'Setting up your wallet…',
      subheading: finished ? (back ? 'Everything is just as you left it.' : 'One last step: create your N.E.D profile.') : 'This takes a few seconds.',
      working: !finished, doneNew: finished && !back, doneBack: finished && back
    };
  }
}
</script>
</body>
</html>
