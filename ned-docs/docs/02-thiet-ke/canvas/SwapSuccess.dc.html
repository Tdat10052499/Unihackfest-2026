<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NED — Swap, done</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; background: linear-gradient(170deg, #110822 0%, #0D0618 30%, #080812 60%, #06060E 100%); color: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="{{glow}}"></div>
  <div style="padding: 12px 24px 8px; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2">
    <div style="font-size: 14px; font-weight: 600; color: #FFFFFF">9:41</div>
    <div style="display: flex; gap: 6px; align-items: center">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="4" width="3" height="8" rx="1" fill="#FFFFFF"></rect><rect x="4" y="2" width="3" height="10" rx="1" fill="#FFFFFF"></rect><rect x="8" y="0" width="3" height="12" rx="1" fill="#FFFFFF"></rect><rect x="12" y="2" width="3" height="10" rx="1" fill="rgba(255,255,255,0.25)"></rect></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2" stroke="rgba(255,255,255,0.3)"></rect><rect x="2" y="2" width="15" height="8" rx="1" fill="#22C55E"></rect><rect x="22.5" y="3.5" width="2" height="5" rx="1" fill="rgba(255,255,255,0.3)"></rect></svg>
    </div>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; padding: 52px 24px 0; position: relative; z-index: 1">
    <img src="{{mascot}}" alt="" style="width: 190px; height: 132px; object-fit: contain">
    <h1 style="margin: 20px 0 0; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; text-align: center">{{title}}</h1>
    <div style="margin-top: 8px; font-size: 14px; line-height: 1.5; text-align: center; color: rgba(255,255,255,0.75)">{{message}}</div>
    <sc-if value="{{ok}}" hint-placeholder-val="{{ true }}">
      <div style="margin-top: 14px; display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.3); border-radius: 9999px">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FBBF24" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16v.5"></path></svg>
        <span style="font-size: 11px; font-weight: 600; color: #FBBF24">Demo mode · real price, no real funds moved</span>
      </div>
    </sc-if>
    <div style="margin-top: 22px; width: 100%; padding: 4px 16px; box-sizing: border-box; border-radius: 18px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09)">
      <sc-for list="{{rows}}" as="d" hint-placeholder-count="5">
        <div style="{{d.style}}">
          <span style="font-size: 13px; color: rgba(255,255,255,0.6)">{{d.label}}</span>
          <span style="{{d.valueStyle}}">{{d.value}}</span>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="padding: 0 20px 28px; display: flex; flex-direction: column; gap: 10px; position: relative; z-index: 1">
    <a href="{{primaryHref}}" style="height: 56px; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 16px; background: linear-gradient(135deg, #7B2FBE 0%, #9B4FDE 50%, #6366F1 100%); font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700; color: #FFFFFF; text-decoration: none">{{primary}}</a>
    <a href="{{secondaryHref}}" style="height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 16px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 600; color: #FFFFFF; text-decoration: none">{{secondary}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"result":{"editor":"enum","options":["success","failed"],"default":"success"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var ok = (this.props.result ?? 'success') !== 'failed';
    var mono = "font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; color: #FFFFFF";
    var green = "font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; color: #86EFAC";
    var data = ok ? [
      ['Paid', '1.00 SOL', mono], ['Received', '148.15 USDC', green], ['N.E.D fee', '$0.37', mono], ['Network fee', '$0.00', mono], ['Time', 'Sat 26 Sep, 13:52', mono]
    ] : [
      ['Tried to swap', '1.00 SOL → USDC', mono], ['Your limit', '0.5% price change', mono], ['Price moved', '0.8%', mono], ['Charged', 'Nothing', green]
    ];
    var rows = data.map(function (d, i) {
      return { label: d[0], value: d[1], valueStyle: d[2], style: 'display: flex; justify-content: space-between; align-items: center; padding: 11px 0;' + (i < data.length - 1 ? ' border-bottom: 1px solid rgba(255,255,255,0.06)' : '') };
    });
    return {
      ok: ok,
      glow: 'position: absolute; top: 120px; left: 50%; margin-left: -170px; width: 340px; height: 300px; pointer-events: none; background: radial-gradient(circle, ' + (ok ? 'rgba(34,197,94,0.17)' : 'rgba(245,158,11,0.14)') + ' 0%, transparent 62%)',
      mascot: ok ? "/_blob/22f5490f03888bc46a04dbf909a17ab4" : "/_blob/195e0aeefc275136e89ec220d2c399a1",
      title: ok ? 'Swap complete' : "Swap didn't go through",
      message: ok ? 'You got 148.15 USDC. It’s already in your wallet.' : 'The price moved more than your limit, so nothing was swapped. Your 1.00 SOL is still in your wallet.',
      rows: rows,
      primary: ok ? 'Done' : 'Try again', primaryHref: ok ? 'HomeV4.dc.html' : 'SwapReview.dc.html',
      secondary: ok ? 'Swap again' : 'Change amount or limit', secondaryHref: 'SwapV1.dc.html'
    };
  }
}
</script>
</body>
</html>
