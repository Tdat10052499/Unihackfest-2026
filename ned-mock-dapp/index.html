<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mock DApp - N.E.D Wallet</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #F3F4F6;
      padding: 20px;
      margin: 0;
      color: #333;
    }
    h2 {
      text-align: center;
      margin-bottom: 24px;
    }
    .card {
      background: #FFFFFF;
      border: 3px solid #000;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 4px 4px 0px #000;
      margin-bottom: 24px;
    }
    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 800;
      border: 2px solid #000;
      border-radius: 8px;
      background-color: #E6F4FE;
      cursor: pointer;
      margin-bottom: 12px;
      box-shadow: 2px 2px 0px #000;
      transition: transform 0.1s;
    }
    button:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px #000;
    }
    button.sign-btn {
      background-color: #35165E;
      color: #FFF;
    }
    .console {
      background: #1E1E1E;
      color: #00FF00;
      padding: 12px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 13px;
      height: 250px;
      overflow-y: auto;
      border: 2px solid #000;
    }
    .log-line {
      margin-bottom: 6px;
      word-break: break-all;
    }
    .error { color: #FF4500; }
  </style>
</head>
<body>

  <h2>Mock DApp Testing</h2>

  <div class="card">
    <button id="connectBtn">🔌 Connect Wallet</button>
    <button id="signBtn" class="sign-btn" disabled>✍️ Sign Dummy TX</button>
  </div>

  <div class="console" id="consoleOutput">
    <div class="log-line">DApp Initialized. Đợi Injector...</div>
  </div>

  <script>
    const connectBtn = document.getElementById('connectBtn');
    const signBtn = document.getElementById('signBtn');
    const consoleOutput = document.getElementById('consoleOutput');

    function log(message, isError = false) {
      const div = document.createElement('div');
      div.className = 'log-line' + (isError ? ' error' : '');
      div.textContent = `> ${message}`;
      consoleOutput.appendChild(div);
      consoleOutput.scrollTop = consoleOutput.scrollHeight;
      console.log(message);
    }

    // Lắng nghe sự kiện Provider đã được tiêm vào (từ useWeb3Bridge.ts)
    window.addEventListener('solana#initialized', () => {
      log('N.E.D Provider detected! (window.solana ready)');
    });

    connectBtn.addEventListener('click', async () => {
      if (!window.solana) {
        log('Lỗi: Không tìm thấy window.solana. Bạn có đang mở trên N.E.D Wallet không?', true);
        return;
      }
      
      try {
        log('Đang gọi window.solana.connect()...');
        const resp = await window.solana.connect();
        
        log(`Kết nối thành công! Public Key: ${resp.publicKey.toString()}`);
        
        // Kích hoạt nút Sign
        signBtn.removeAttribute('disabled');
      } catch (err) {
        log(`Kết nối thất bại: ${err.message}`, true);
      }
    });

    signBtn.addEventListener('click', async () => {
      if (!window.solana || !window.solana.isConnected) {
        log('Lỗi: Vui lòng kết nối ví trước!', true);
        return;
      }

      try {
        log('Đang gửi yêu cầu signTransaction...');
        
        // Tạo một mảng byte giả lập Transaction (64 bytes dummy data)
        const dummyTxData = new Uint8Array(64);
        dummyTxData.fill(1); // Fill data test
        
        // Tạo Dummy Transaction Object mô phỏng cú pháp Solana Web3.js
        const dummyTransaction = {
          serialize: () => dummyTxData
        };

        const signedTx = await window.solana.signTransaction(dummyTransaction);
        
        log('Ký giao dịch thành công!');
        log(`Dữ liệu chữ ký trả về: ${signedTx.serialize().length} bytes`);
      } catch (err) {
        log(`Từ chối ký: ${err.message}`, true);
      }
    });
  </script>
</body>
</html>
